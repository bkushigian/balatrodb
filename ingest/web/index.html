<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BalatroDB</title>
<link rel="stylesheet" href="balatro.css">
</head>
<body>
<header>
  <h1>Balatro<span>DB</span></h1>
  <div class="sub" id="sub">loading…</div>
  <nav class="nav">
    <a class="pixel-pill" href="/" aria-current="page">Dashboard</a>
    <a class="pixel-pill" href="/stats.html">Stats</a>
  </nav>
</header>

<main>
  <section class="panel filters" aria-label="Filters">
    <span><label>Deck</label><span class="pick" id="deck"></span>
      <button class="seg pixel-pill" id="noplasma" aria-pressed="false"
        title="Plasma balances chips and mult before scoring, so its numbers are not comparable with other decks">No Plasma</button></span>
    <span><label>Stake</label><span class="pick" id="stake"></span></span>
    <span><label>Joker records</label>
      <span class="seggroup" id="heldg" role="group" aria-label="Counter joker records">
        <button class="seg pixel-pill" data-v="1" aria-pressed="true"
          title="Counter jokers whose record was set while someone held them">Held</button>
        <button class="seg pixel-pill" data-v="0" aria-pressed="true"
          title="Counters that reached a high with nobody holding the joker">Not held</button>
      </span></span>
    <span><label>Seed</label>
      <span class="seggroup" id="seeded" role="group" aria-label="Seeded runs">
        <button class="seg pixel-pill" data-v="0" aria-pressed="true"
          title="Runs whose seed the game chose">Random</button>
        <button class="seg pixel-pill" data-v="1" aria-pressed="true"
          title="Runs you entered a seed for -- practice, not records">Seeded</button>
      </span></span>
    <span><label>Include</label>
      <span class="seggroup" id="phase" role="group" aria-label="Which phases to include">
        <button class="seg pixel-pill" data-v="0" aria-pressed="true"
          title="Everything up to the point a run continued past the win ante">Non-endless</button>
        <button class="seg pixel-pill" data-v="1" aria-pressed="true"
          title="Only what happened after continuing past the win ante">Endless</button>
      </span></span>
  </section>

  <section class="tiles" id="tiles" aria-label="Records"></section>

  <!-- The run you are in the middle of. Hidden entirely when there is not
       one, rather than sitting there empty. -->
  <section id="live" aria-label="Run in progress" hidden></section>

  <!-- Jokers takes the width of its four columns and the hands table takes
       the rest, which is roughly how much each of them needs. Below about
       1200px the pair wraps and both go full width. -->
  <section class="pair">
    <div class="panel fit">
      <h2>Jokers</h2>
      <div class="scroll"><table id="jokers"></table></div>
    </div>

    <!-- Three questions about the same twelve hands, which used to be three
         panels repeating the same twelve rows of art and names. One row per
         hand now, three clusters across; each cluster carries the deck, the
         stake and the click of whichever run set THAT figure, which is
         usually not the same run. -->
    <div class="panel grow">
      <h2>Poker hands</h2>
      <div class="scroll"><table id="hands"></table></div>
    </div>
  </section>

  <section class="panel">
    <h2>Runs</h2>
    <div class="runsort"><label>Sort by</label>
      <span class="mpick"><span class="mlab">Joker scores</span><span class="pick" id="m_joker"></span></span>
      <span class="mpick"><span class="mlab">Hand scores</span><span class="pick" id="m_hand_score"></span></span>
      <span class="mpick"><span class="mlab">Hand levels</span><span class="pick" id="m_hand_level"></span></span>
      <span class="mpick"><span class="mlab">Hands played</span><span class="pick" id="m_hand_played"></span></span>
    </div>
    <div class="scroll"><table id="runs"></table></div>
  </section>
</main>

<div id="tip" role="tooltip" hidden></div>
<dialog id="detail"><div class="head"><h2 id="dtitle">Run</h2>
  <button class="x pixel-pill" onclick="detail.close()">Close</button></div>
  <div class="body" id="dbody"></div></dialog>

<script src="balatro.js"></script>
<script>




// What a run was the FIRST to achieve, at the time it was played -- not
// what still stands. Jokers wear their own art, hands their Planet card;
// since the three hand statistics share that art, the value carries the
// distinction, and the colour says which: score blue, level green, plays
// gold, joker peaks in mult red.
// A hand score is whole chips like every other score; a joker peak is not
// -- Lucky Cat really does sit at x5.5 -- so the formatter goes with the
// kind rather than being chosen once for the whole panel.

// One small tile of the run's metadata. `raw` skips formatting for a value
// that is already markup, like the seed's copy button.
const mt = (label, value, tone, raw) =>
  `<div class="mt"><div class="mtk">${esc(label)}</div>
    <div class="mtv ${tone || ""}">${raw ? value : value}</div></div>`;

const recordsCell = r => {
  const recs = r.records || [];
  if (!recs.length) return `<span class="muted">—</span>`;
  const head = recs.slice(0, RECORDS_SHOWN).map(rec => {
    const cls = recCls(rec);
    // Endless records are a separate contest, so they are marked -- with no
    // phase filter on, a row can carry one of each for the same subject.
    const i = TIPS.push(rec) - 1;
    return `<span class="bj${rec.endless ? " rec-endless" : ""}" data-tip="${i}">` +
      (recordArt(rec) || `<span class="jv">${esc(rec.subject)}</span>`) +
      `<span class="sc ${cls}">${recPre(rec)}${recFmt(rec)(rec.value_txt)}</span></span>`;
  }).join("");
  const rest = recs.slice(RECORDS_SHOWN);
  const more = rest.length
    ? `<span class="more" title="${esc(rest.map(recordText).join("\n"))}&#10;Open the run to see them all."
        >+${rest.length} more</span>` : "";
  return `<span class="recs">${head}${more}</span>`;
};

const handCell = h => `<span class="namecell">${
  sprite(planetOf(h), "j", 56)
  }<span>${esc(h)}</span></span>`;


// Deck and stake are shown as their sprite alone; the name is a hover. The
// icon is the thing you actually recognise, and the text was repeated down
// every row of every panel.
const deckCell = r => r.deck_key
  ? `<span class="deckcell" title="${esc(nameOf(r.deck_key, r.deck_name))}">${
      sprite(r.deck_key, "b", 48) ||
      `<span class="muted">${esc(r.deck_name || r.deck_key)}</span>`}</span>`
  : `<span class="muted">—</span>`;
const stakeCell = r => r.stake_key
  ? `<span class="deckcell" title="${esc(nameOf(r.stake_key))}">${
      sprite(r.stake_key, "s", 36) ||
      `<span class="muted">${esc(r.stake_key.replace("stake_", ""))}</span>`}</span>`
  : `<span class="muted">—</span>`;

// ── sortable tables ──────────────────────────────────────────────────────
// Each panel declares its columns once: how to render a cell, and what to
// sort it by. Sorting works on the row objects rather than the rendered DOM,
// so a big score sorts by its ordering key and not by its digits as text.
const TBL = {};

function defineTable(id, cols, opts) {
  const o = opts || {};
  TBL[id] = { id, cols, rows: [], empty: o.empty || "Nothing yet.",
              onclick: o.onclick, groups: o.groups,
              sort: { i: o.sort === undefined ? null : o.sort, dir: -1 } };
}

function setRows(id, rows) { TBL[id].rows = rows || []; drawTable(id); }

function sortKey(t, r) {
  const c = t.cols[t.sort.i];
  const v = c.sort ? c.sort(r) : null;
  return v === undefined ? null : v;
}

function drawTable(id) {
  const t = TBL[id], el = document.getElementById(id);
  if (!el) return;
  const head = t.cols.map((c, i) => {
    const on = t.sort.i === i;
    const dir = on ? (t.sort.dir < 0 ? "descending" : "ascending") : "none";
    return `<th class="${c.num ? "num " : ""}${c.cls ? c.cls + " " : ""}sortable" data-i="${i}"
      aria-sort="${dir}"${c.title ? ` title="${esc(c.title)}"` : ""}
      >${esc(c.label)}<span class="ind">${on ? (t.sort.dir < 0 ? "▾" : "▴") : ""}</span></th>`;
  }).join("");
  // A banner row above the columns, for a table whose columns come in
  // clusters that each answer a different question about the same row.
  const groups = t.groups ? `<tr class="grouprow">` + t.groups.map(g =>
    `<th colspan="${g.span}"${g.cls ? ` class="${g.cls}"` : ""}${
      g.title ? ` title="${esc(g.title)}"` : ""}>${esc(g.label)}</th>`).join("")
    + `</tr>` : "";

  let rows = t.rows.slice();
  if (t.sort.i !== null) {
    rows.sort((a, b) => {
      const x = sortKey(t, a), y = sortKey(t, b);
      // Missing values always sort last, whichever way the column is pointing.
      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      const d = typeof x === "string" || typeof y === "string"
        ? String(x).localeCompare(String(y)) : (x - y);
      return d * t.sort.dir;
    });
  }

  const body = rows.length ? rows.map(r => {
    // The run id goes in a data attribute, not into JS source inside an
    // onclick. esc() is HTML escaping: the parser decodes &#39; back to an
    // apostrophe BEFORE the JS is parsed, so it never protected a string
    // literal. A delegated listener sidesteps the whole question.
    const click = t.onclick ? ` class="clickable" data-run="${esc(r.run_id)}"` : "";
    return `<tr${click}>` + t.cols.map(c => {
      // A cell may point at a different run from its row: in the hands
      // table each cluster was set by whichever run did that particular
      // thing, and they are rarely the same run.
      const own = c.run ? c.run(r) : null;
      return `<td class="${[c.num ? "num" : "", c.cls || "",
                           own ? "cellrun" : ""].filter(Boolean).join(" ")}"${
        own ? ` data-run="${esc(own)}"` : ""}${
        c.cl ? ` data-cl="${esc(c.cl)}"` : ""}${
        c.style ? ` style="${c.style}"` : ""}>${c.cell(r)}</td>`;
    }).join("") + `</tr>`;
  }).join("")
    : `<tr><td colspan="${t.cols.length}" class="empty">${esc(t.empty)}</td></tr>`;

  el.innerHTML = `<thead>${groups}<tr>${head}</tr></thead><tbody>${body}</tbody>`;
  if (t.onclick) {
    el.querySelectorAll("tbody tr.clickable").forEach(tr => {
      tr.onclick = () => openRun(tr.dataset.run);
    });
  }
  // Cell before row: clicking a cluster opens the run that set THAT
  // figure, not whatever the row as a whole points at.
  el.querySelectorAll("tbody td.cellrun").forEach(td => {
    td.onclick = ev => { ev.stopPropagation(); openRun(td.dataset.run); };
  });
  // A cluster is one item -- a figure, and the deck and stake of the run
  // that set it -- so it lights up as one rather than as three boxes.
  const lit = (tr, cl, on) => {
    if (!tr || !cl) return;
    tr.querySelectorAll(`td[data-cl="${cl}"]`)
      .forEach(x => x.classList.toggle("hot", on));
  };
  el.addEventListener("mouseover", ev => {
    const td = ev.target.closest("td[data-cl]");
    if (td) lit(td.parentElement, td.dataset.cl, true);
  });
  el.addEventListener("mouseout", ev => {
    const td = ev.target.closest("td[data-cl]");
    if (td) lit(td.parentElement, td.dataset.cl, false);
  });
  el.querySelectorAll("button.seed").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); copySeed(b, b.dataset.seed); };
  });
  el.querySelectorAll("th.sortable").forEach(th => {
    th.onclick = () => {
      const i = +th.dataset.i;
      // Sorting by a column and sorting by a joker/hand metric are
      // alternatives: picking one drops the other. Clicking the metric's own
      // column just flips its direction.
      if (t.onHeaderSort && t.onHeaderSort(i)) return;
      // First click on a column sorts descending -- for these panels the
      // interesting end is almost always the top.
      if (t.sort.i === i) t.sort.dir = -t.sort.dir;
      else { t.sort.i = i; t.sort.dir = -1; }
      drawTable(id);
    };
  });
}

// Click to copy, with the seed itself as the confirmation.
function copySeed(el, seed) {
  const done = ok => {
    const was = el.textContent;
    el.textContent = ok ? "COPIED" : "PRESS ⌘C";
    el.classList.toggle("copied", ok);
    setTimeout(() => { el.textContent = was; el.classList.remove("copied"); }, 1100);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(seed).then(() => done(true), () => done(false));
    return;
  }
  // http://localhost is a secure context in Chrome but not everywhere, so
  // fall back rather than silently doing nothing.
  const ta = document.createElement("textarea");
  ta.value = seed; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  done(ok);
}

const seedCell = r => r.seed
  ? `<button class="seed pixel-pill sm${r.seeded ? " seeded" : ""}" data-seed="${esc(r.seed)}"
       title="${r.seeded ? "Entered seed — " : ""}Click to copy"
       >${esc(r.seed)}</button>`
  : `<span class="muted">—</span>`;
const shortRun = r => (r || "").split("-")[1] || r;

// Which build of the mod wrote this run. It is per SEGMENT, so a run
// resumed after an update legitimately carries two -- and that matters,
// because what the log captures has changed between versions.
const modVersions = segs => {
  const v = [...new Set((segs || []).map(x => x.ver_balatrodb).filter(Boolean))];
  return v.length ? v.map(x => `v${esc(x)}`).join(" → ")
                  : `<span class="muted">—</span>`;
};


function resultChip(r) {
  // No run.end yet: either still being played, or the game crashed. The log
  // grows as you play, so this row updates live.
  if (!r.result) return `<span class="chip pixel-pill sm live">IN PROGRESS</span>`;

  // Winning and ending are different facts. Beating the win ante is a win
  // even if the run later died in endless, so both are shown rather than the
  // win hiding the ending -- which read as "you won" on a run that lost.
  // "loss" is the older spelling of "died"; both appear in the corpus.
  // A paused run is only paused until you start something else: Balatro
  // keeps one save per profile, so the next run overwrote it. `abandoned`
  // is derived across runs, because nothing can log that moment -- the
  // paused run had already stopped writing.
  const CHIP = {
    died:      ["died", "DIED"],
    loss:      ["died", "DIED"],
    suspended: r.abandoned ? ["other", "RESTARTED"] : ["susp", "PAUSED"],
    quit:      ["susp", "QUIT"],
    new_run:   ["other", "RESTARTED"],
    completed: null,                 // finished after winning: the WON says it
    unknown:   ["other", "UNKNOWN"],
  }[r.result];

  const out = [];
  if (r.won) out.push(`<span class="chip pixel-pill sm win">WON</span>`);
  if (CHIP) out.push(`<span class="chip pixel-pill sm ${CHIP[0]}">${CHIP[1]}</span>`);
  else if (!r.won) out.push(`<span class="muted">${esc(r.result)}</span>`);
  return out.join(" ");
}

// ── panel definitions ────────────────────────────────────────────────────
// Marks a table's rows as openable; the handler is attached in drawTable.
const openRunJS = true;
// A counter joker reads game state rather than its own ability, and so can
// hold two different records: the counter while it was actually scoring,
// and the highest the counter ever reached whether or not anyone held the
// joker. The second is a real record about the run -- a Fortune Teller best
// set without ever owning one -- so it is its own row, marked, rather than
// being folded into the first.

const jokerTip = r => !r.counter ? "" :
  ` title="${esc(r.counter + (r.held
      ? " · while the joker was in hand"
      : " · the counter reached this, but nobody held the joker for it"))}"`;

const jokerCell = r => `<span class="namecell"${jokerTip(r)}
  ><span class="jart">${sprite(r.key, "j", 56)}${handIcon(r)}</span>
  <span>${esc(nameOf(r.key))}${r.what
    ? `<br><span class="sub2">${esc(r.what)}</span>` : ""}</span></span>`;

defineTable("jokers", [
  { label: "Joker", cell: jokerCell, sort: r => nameOf(r.key) },
  // Coloured by what it actually is: chips blue, mult red, X-mult red. The
  // board shows a counter joker's CONTRIBUTION, so Bull reads +378 chips,
  // the number a player watches it add, not "189 dollars".
  { label: "Peak", num: true,
    cell: r => `<span class="sc ${
      { chips: "sc-chips", mult: "sc-mult", x_mult: "sc-xmult" }[r.field] || "sc-mult"
    }">${r.field === "x_mult" ? "X" : "+"}${fmt(r.value)}</span>`,
    sort: r => r.ord },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
], { empty: "No jokers recorded yet.", onclick: openRunJS, sort: 1 });

// One row per hand, three clusters across: its best score, its highest
// level, and the most times it was played in a run. They are three
// different questions about the same twelve subjects, and each is usually
// answered by a DIFFERENT run -- so each cluster carries its own deck,
// stake and click target.
const CLUSTER = [
  ["score",  "Score",  "var(--chips)", r => fmtScore(r.value), r => r.ord,
   "The biggest that hand has ever scored, and the run that did it."],
  ["level",  "Level",  "var(--green)", r => fmt(r.level), r => r.level,
   "The highest that hand has ever been levelled, and the run that did it."],
  ["played", "Played", "var(--gold)",  r => fmt(r.played), r => r.played,
   "The most times that hand was played within a single run."],
];

const handCols = () => {
  const cols = [{ label: "Hand", title: "Sorts by poker-hand strength.",
                  cell: r => handCell(r.hand), sort: r => handRank(r.hand) }];
  for (const [key, label, colour, text, ord, title] of CLUSTER) {
    const at = r => r[key];                      // may be absent for a hand
    const run = r => (at(r) ? at(r).run_id : null);
    cols.push(
      { label, title, num: true, cl: key, cls: "clstart",
        style: `color:${colour};font-weight:700`,
        cell: r => (at(r) ? text(at(r)) : `<span class="muted">—</span>`),
        sort: r => (at(r) ? ord(at(r)) : null), run },
      { label: "Deck", cl: key, cell: r => (at(r) ? deckCell(at(r)) : ""),
        sort: r => (at(r) ? at(r).deck_name : null), run },
      { label: "Stake", cl: key, cls: "clend",
        cell: r => (at(r) ? stakeCell(at(r)) : ""),
        sort: r => (at(r) ? at(r).stake_key : null), run });
  }
  return cols;
};

defineTable("hands", handCols(), {
  empty: "No hands recorded yet.",
  sort: 1,
  groups: [{ label: "", span: 1 }].concat(CLUSTER.map(([, label, , , , title]) =>
    ({ label, span: 3, cls: "grp", title }))),
});

// The three answers arrive from three endpoints, each already filtered and
// ranked the same way. Joined here on the hand rather than in SQL, so the
// leaderboards stay one query apiece and nothing has to agree about ties.
function setHandMatrix(best, levels, counts) {
  const by = new Map();
  const at = hand => {
    if (!by.has(hand)) by.set(hand, { hand });
    return by.get(hand);
  };
  for (const r of best || []) at(r.hand).score = r;
  for (const r of levels || []) at(r.hand).level = r;
  for (const r of counts || []) at(r.hand).played = r;
  setRows("hands", [...by.values()]);
}

const RUNS_COLS = () => [
  { label: "When", cls: "muted", cell: r => ago(r.started_ts),
    sort: r => r.started_ts },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
  { label: "Result",
    cell: r => resultChip(r) + (r.went_endless
      ? ' <span class="chip pixel-pill sm endless">ENDLESS</span>' : ""),
    sort: r => r.result || "" },
  { label: "Records", cls: "recscell",
    title: "What this run was the first to achieve, at the time it was played.",
    cell: recordsCell, sort: r => (r.records || []).length },
  { label: "Ante", num: true, cell: r => r.ante ?? "—", sort: r => r.ante },
  { label: "Rounds won", num: true, cls: "muted",
    title: "Blinds cleared. A round is only cashed out when its blind was beaten.",
    cell: r => r.rounds_won ?? "—", sort: r => r.rounds_won },
  { label: "Best hand", num: true, cell: r => fmtScore(r.best_hand),
    sort: r => r.bh_ord },
  { label: "Peak $", num: true,
    cell: r => r.peak_money !== null ? "$" + fmt(r.peak_money) : "—",
    sort: r => r.peak_money },
  { label: "Hands", num: true, cls: "muted", cell: r => r.hands_played ?? "—",
    sort: r => r.hands_played },
  { label: "Deck size", num: true, cls: "muted", cell: r => r.deck_size ?? "—",
    sort: r => r.deck_size },
  { label: "Seed", cell: seedCell, sort: r => r.seed },
];

// Where the metric column is inserted, and what it is called.
// After Result, which itself follows Records.
const METRIC_AT = 5;
const metricLabel = spec => {
  const [kind, subject] = (spec || "").split(":");
  const name = kind === "joker" ? nameOf(subject) : subject;
  return { joker: name + " peak", hand_score: name + " best",
           hand_level: name + " lvl", hand_played: name + " played" }[kind] || name;
};

function defineRunsTable() {
  const cols = RUNS_COLS();
  if (state.metric) {
    cols.splice(METRIC_AT, 0, {
      label: metricLabel(state.metric), num: true,
      style: "color:var(--gold);font-weight:700",
      cell: r => (r.metric_txt === null || r.metric_txt === undefined)
        ? `<span class="muted">—</span>` : fmt(r.metric_txt),
      sort: r => r.metric_ord,
    });
  }
  const prev = TBL.runs && TBL.runs.sort;
  defineTable("runs", cols, {
    empty: "No runs match these filters.", onclick: openRunJS,
    sort: state.metric ? METRIC_AT : 0,
  });
  // A column sort survives a refresh; a metric sort always owns its column.
  if (!state.metric && prev && prev.i !== null && prev.i < cols.length) {
    TBL.runs.sort = prev;
  }
  TBL.runs.onHeaderSort = i => {
    if (!state.metric || i === METRIC_AT) return false;
    state.metric = "";
    buildMetricPickers();
    refresh();
    return true;
  };
}
defineRunsTable();

async function refresh() {
  const [s, jok, hands, levels, counts, runs, live] = await Promise.all([
    get("/api/summary"), get("/api/jokers"), get("/api/hands"),
    get("/api/hand_levels"), get("/api/hand_counts"), get("/api/runs"),
    // Not filtered: the run you are in the middle of is the run you are in
    // the middle of, whatever the page is currently showing. ?live=<run>
    // points the panel at a chosen run instead, which is how a finished run
    // can be seen the way it looked while it was being played.
    fetch("/api/live" + (livePreview() ? "?id=" + encodeURIComponent(livePreview()) : ""))
      .then(x => x.json()),
  ]);
  drawLive(live);

  $("#sub").textContent = summaryLine(s);
  drawSummary($("#tiles"), s);

  setRows("jokers", jok);
  setHandMatrix(hands.best, levels, counts);
  TIPS = [];                       // rebuilt with the rows that reference it
  defineRunsTable();
  setRows("runs", runs);

}

async function openRun(id) {
  history.replaceState(null, "", `#run=${encodeURIComponent(id)}`);
  const d = await fetch("/api/run?id=" + encodeURIComponent(id)).then(r => r.json());
  if (!d.run) return;
  const r = d.run;
  $("#dtitle").innerHTML =
    `<span class="dtdeck">${sprite(r.deck_key, "b", 38)}${esc(r.deck_name) || "?"}</span>
     <span class="dtdeck">${sprite(r.stake_key, "s", 30)}${esc(nameOf(r.stake_key))}</span>
     ${resultChip(r)} ${r.went_endless ? '<span class="chip pixel-pill sm endless">ENDLESS</span>' : ""}`;
  const rounds = d.rounds.map(x => `
    <tr class="roundrow clickable" data-round="${x.round_seq}">
      <td class="num">${x.round_seq}</td>
      <td class="num">${x.ante ?? "—"}</td><td>${esc(x.blind_name) || "—"}</td>
      <td class="num">${fmtScore(x.required_txt)}</td><td class="num">${fmtScore(x.score_txt)}</td>
      <td class="num">${x.cashout_total !== null ? "$" + x.cashout_total : "—"}</td>
      <td class="num muted">${x.deck_size ?? "—"}</td>
      <td>${x.endless ? '<span class="chip pixel-pill sm endless">ENDLESS</span>' : ""}</td></tr>
    <tr class="detail" data-for="${x.round_seq}" hidden><td colspan="8"></td></tr>`).join("");
  // Every record the run set, laid out rather than hidden behind "+N more".
  const recs = (d.records || []).map(rec => {
    const [, name, what] = RECORD_KIND[rec.kind] || ["sc-other", x => x, ""];
    const cls = recCls(rec), f = recFmt(rec);
    const beat = rec.prev_txt === null || rec.prev_txt === undefined
      ? `<span class="muted">first of its kind</span>`
      : `beat <b>${f(rec.prev_txt)}</b>` +
        (rec.prev_deck ? ` <span class="muted">· ${esc(rec.prev_deck)}</span>` : "");
    return `<div class="rec${rec.endless ? " rec-endless" : ""}">
      ${recordArt(rec, 44)}
      <div class="recmain">
        <div class="recttl">${esc(name(rec.subject))}</div>
        <div class="recsub">${esc(what)}${rec.endless ? " · endless" : ""}</div>
      </div>
      <div class="recval ${cls}">${recPre(rec)}${f(rec.value_txt)}</div>
      <div class="recbeat">${beat}</div>
    </div>`;
  }).join("");

  // From the server, which owns the rule that a round is won iff it
  // reached a cash-out. Recomputing it here meant two implementations under
  // one label -- and this one ignored the phase filter, so a run could read
  // 24 in the table and 39 in the dialog.
  const cleared = d.rounds_won;

  const jok = d.jokers.map(j => `<tr><td>${esc(nameOf(j.key))}</td><td class="muted">${esc(j.field)}</td>
    <td class="num" style="color:var(--mult)">${fmt(j.peak)}</td></tr>`).join("");
  $("#dbody").innerHTML = `
    <h3>Run</h3>
    <div class="runmeta">
      ${mt("Ante", fmt(r.furthest_ante ?? r.ended_ante), "gold")}
      ${mt("Rounds won", fmt(cleared), "green")}
      ${mt("Hands", fmt(r.hands_played), "")}
      ${mt("Best hand", fmtScore(r.best_hand_txt), "chips")}
      ${mt("Final", r.final_dollars === null ? "—" : "$" + fmt(r.final_dollars), "money")}
      ${mt("Deck size", fmt(r.deck_size), "")}
      ${mt("Sessions", fmt(d.segments.length), "")}
      ${mt("Logged by", modVersions(d.segments), "", true)}
      ${mt("Seed", seedCell(r), "", true)}
    </div>
    <div class="muted logline">${ago(r.started_ts)} · log
      <code>${esc(r.log_file)}</code></div>
    ${d.defects.length ? `<div class="warn" style="margin-top:8px">⚠ capture defects:
      ${d.defects.map(x => esc(x.defect)).join(", ")} — figures from this run may not be
      comparable with newer ones.</div>` : ""}
    <h3>Records set</h3>
    ${recs ? `<div class="recgrid">${recs}</div>`
           : `<div class="empty">This run set no records.</div>`}
    <h3>Rounds</h3>
    <div class="scroll"><table><thead><tr><th>#</th><th>Ante</th><th>Blind</th>
      <th class="num">Needed</th><th class="num">Scored</th><th class="num">Cash</th>
      <th class="num">Deck</th><th></th></tr></thead>
      <tbody>${rounds || '<tr><td colspan="8" class="empty">No rounds.</td></tr>'}</tbody></table></div>
    <h3>Joker peaks</h3>
    <div class="scroll"><table><thead><tr><th>Joker</th><th>Field</th>
      <th class="num">Peak</th></tr></thead>
      <tbody>${jok || '<tr><td colspan="3" class="empty">No scaling jokers.</td></tr>'}</tbody></table></div>`;
  $("#detail").showModal();

  // Expand a round to step through it: every play and discard in order, the
  // cards in each, the running score, and the jokers held at the time.
  $("#dbody").querySelectorAll("tr.roundrow").forEach(tr => {
    tr.onclick = () => toggleRound(id, tr);
  });
}

// `c.key` is the card's base: c_base for a plain card, m_lucky / m_steel /
// ... for an enhanced one. A stone card has no rank or suit to show -- the
// enhancement is the whole card -- so it gets no face.
function cardSprite(c) {
  const base = sprite(c.key || "c_base", "pc", 56);
  const face = c.key === "m_stone" ? ""
    : sprite(`card:${c.suit}:${c.rank}`, "pc face", 56);
  if (!base && !face) {
    return `<span class="jv">${esc((c.rank || "?") + ((c.suit || "")[0] || ""))}</span>`;
  }
  const ed = c.edition ? ` ed ed-${esc(String(c.edition).replace(/^e_/, ""))}` : "";
  const seal = c.seal
    ? `<span class="seal ${esc(String(c.seal).toLowerCase())}"></span>` : "";
  const what = [c.enhancement, c.seal && c.seal + " Seal",
                c.edition && String(c.edition).replace(/^e_/, "")]
    .filter(Boolean).join(", ");
  const label = `${c.rank || ""}${c.suit ? " of " + c.suit : ""}${what ? " (" + what + ")" : ""}`;
  return `<span class="pcard${ed}" title="${esc(label.trim())}">${base}${face}${seal}</span>`;
}

async function toggleRound(runId, tr) {
  const rs = tr.dataset.round;
  const row = $(`#dbody tr.detail[data-for="${rs}"]`);
  if (!row.hidden) { row.hidden = true; tr.classList.remove("open"); return; }
  tr.classList.add("open");
  row.hidden = false;
  const cell = row.firstElementChild;
  cell.innerHTML = `<div class="steps"><span class="muted">loading…</span></div>`;

  const d = await fetch(`/api/round?id=${encodeURIComponent(runId)}&round=${rs}`)
    .then(r => r.json());
  if (!d.steps || !d.steps.length) {
    cell.innerHTML = `<div class="steps"><span class="muted">Nothing recorded for this round.</span></div>`;
    return;
  }

  // Board first, then the actions in the order they were taken. The board is
  // its own thing rather than a row spliced between actions -- it is state,
  // not something that happened.
  const board = (d.board || []).length
    ? `<div class="board"><span class="lbl">Jokers</span>` +
      d.board.map(j => {
        // Named, not just drawn. Balatro's own data puts j_wee at the same
        // atlas cell as j_joker (game.lua:499, pos={x=0,y=0}), so Wee Joker
        // renders as a plain Joker and reads as missing from the board. The
        // name settles it for that and for any sprite we cannot resolve.
        return `<span class="bj" title="${esc(nameOf(j.key))}">` +
          (sprite(j.key, "j", 52) || "") +
          `<span class="bjn">${esc(nameOf(j.key))}</span>` +
          scaleTag(j.scale) + `</span>`;
      }).join("") + `</div>`
    : "";

  cell.innerHTML = board + `<div class="steps">` + d.steps.map(s => {
    const cards = (s.cards || []).map(cardSprite).join("");
    // Only what this action moved, so scaling stays visible without
    // reprinting the whole board on every row.
    const moved = (s.joker_delta || []).length
      ? `<div class="moved">` + s.joker_delta.map(m =>
          `<span class="bj" title="${esc(nameOf(m.key) + " " + m.field)}">` +
          (sprite(m.key, "j", 32) || "") +
          `<span class="jv">${esc(nameOf(m.key))}</span>` +
          scaleTag({ field: m.field, value: m.to })
          + `</span>`).join("") +
        `</div>`
      : "";
    const cash = s.money ? `<span class="cash">+$${fmt(s.money)}</span>` : "";

    if (s.kind === "play") {
      return `<div class="step play">
        <span class="what">${esc(s.hand) || "hand"}${s.level ? `<span class="jv">lvl ${s.level}</span>` : ""}</span>
        <span class="hand">${cards}${moved}</span>
        <span class="score"><b>+${fmtScore(s.score_txt)}</b><br>
          <span>${fmtScore(s.total_after)} total</span>${cash}</span></div>`;
    }
    const nc = s.cards_n ?? (s.cards || []).length;
    return `<div class="step discard">
      <span class="what">discard</span>
      <span class="hand">${cards}${moved}</span>
      <span class="score"><span>${nc} card${nc === 1 ? "" : "s"}</span>${cash}</span></div>`;
  }).join("") + `</div>`;
}

// ── the run in progress ──────────────────────────────────────────────────
// What each kind of chase wears: the art to draw it with, how to name it,
// and the colour the game gives that quantity.
const CHASE_ART = {
  hand_score:  [h => sprite(planetOf(h), "j", 34), h => h, "sc-chips", fmtScore],
  hand_level:  [h => sprite(planetOf(h), "j", 34), h => h, "sc-level", fmt],
  hand_played: [h => sprite(planetOf(h), "j", 34), h => h, "sc-money", fmt],
  joker:       [k => sprite(k, "j", 34), k => nameOf(k), "sc-mult", fmt],
  counter:     [k => sprite(k, "j", 34), k => nameOf(k), "sc-chips", fmt],
};
const CHASE_WHAT = {
  hand_score: "score", hand_level: "level", hand_played: "plays",
  joker: "peak", counter: "counter",
};

// Past the record it is no longer a percentage worth printing -- one run
// sat at eleven million percent of the standing best. It is either beaten
// or it is on the way.
function chaseItem(c) {
  const [art, name, cls, f] = CHASE_ART[c.kind] || CHASE_ART.joker;
  const pct = Math.max(0, Math.min(1, c.pct));
  const ahead = c.pct >= 1;
  const head = c.first
    ? `<span class="flag first">First ever</span>`
    : ahead ? `<span class="flag">New record!</span>`
            : `<span class="pc">${Math.round(c.pct * 100)}%</span>`;
  // Two records, because they are two different things: the corpus best is
  // the record, and the best at the stake you are actually playing is the
  // one in reach. The stake's is marked when this run is already past it.
  const stake = c.stake_txt === null || c.stake_txt === undefined ? ""
    : `<span class="ofs${c.beats_stake ? " past" : ""}">${
        sprite(c.stake_key, "s", 17) || ""}${f(c.stake_txt)}</span>`;
  const foot = c.first
    ? `<span class="of">nothing to beat</span>`
    : `<span class="of">of ${esc(f(c.record_txt))}</span>${stake}`;
  return `<div class="chase${ahead ? " ahead" : ""}">
      ${art(c.key) || ""}
      <div class="cb">
        <div class="cl">${esc(name(c.key))} <span class="cw">${
          esc(CHASE_WHAT[c.kind] || "")}</span></div>
        <div class="cv">${c.value_txt === null || c.value_txt === undefined
          ? `<b class="sc muted">—</b>` : `<b class="sc ${cls}">${f(c.value_txt)}</b>`
        } ${foot}</div>
        <div class="track"><span class="fill" style="width:${
          (pct * 100).toFixed(1)}%"></span></div>
      </div>
      ${head}
    </div>`;
}

const livePreview = () => new URLSearchParams(location.search).get("live") || "";

// What the run is doing, in the game's own colours: green while it is being
// played, purple once it is past the win ante, gold for a win that stopped
// there, grey for one left at the menu.
const LIVE_PHASE = {
  live:    ["live",    "LIVE"],
  endless: ["endless", "ENDLESS"],
  won:     ["win",     "WON"],
  paused:  ["susp",    "PAUSED"],
  over:    ["other",   "LAST RUN"],
};

// The panel redraws on every poll, so "I opened the list" has to live
// outside it or the list would shut again every three seconds.
const CHASES_SHOWN = 6;
let chasesOpen = false;

function drawLive(d) {
  const el = $("#live");
  if (!d || !d.run) { el.hidden = true; return; }
  el.hidden = false;
  const r = d.run;
  const stat = (v, k) => `<span class="lv"><b>${v}</b><i>${esc(k)}</i></span>`;
  const phase = LIVE_PHASE[r.phase] || LIVE_PHASE.live;

  // The board as it stands, with whatever each joker is accumulating.
  const board = (d.board || []).map(j =>
    `<span class="bj" title="${esc(nameOf(j.key))}">
       ${sprite(j.key, "j", 52) || esc(nameOf(j.key))}${scaleTag(j.scale)}</span>`
  ).join("") || `<span class="muted">no jokers yet</span>`;

  // Every scaling joker in hand, however far off. A card can appear here
  // and in the chases above; that is the two lists agreeing.
  const held = (d.holding || []).map(chaseItem).join("");

  const all = d.chasing || [];
  const shown = chasesOpen ? all : all.slice(0, CHASES_SHOWN);
  const chases = shown.map(chaseItem).join("");
  const hidden = all.length - shown.length;
  const more = (hidden > 0 || chasesOpen)
    ? `<button class="chmore pixel-pill" id="chtoggle" aria-expanded="${chasesOpen}"
        >${chasesOpen ? "Show fewer"
                      : `+${hidden} more within reach`}</button>` : "";

  el.innerHTML = `
   <div class="liverun pixel-pill">
    <div class="livetitle">
      <span class="chip pixel-pill sm ${phase[0]}${r.fresh ? " beating" : ""}"
        >${phase[1]}</span>
      <span>Current run</span>
      ${r.fresh ? "" :
        `<span class="ago">last played ${esc(ago(r.last_ts))}</span>`}
      <span class="seedwrap">${seedCell(r)}</span>
    </div>
    <div class="livebar" title="Open this run">
      <div class="lboard">${board}</div>
      <div class="lstats">
        ${deckCell(r)}${stakeCell(r)}
        ${stat(esc(String(d.ante ?? "—")), d.blind ? esc(d.blind) : "ante")}
        ${stat("$" + fmt(d.money), "money")}
        ${stat("$" + fmt(d.spent), "spent")}
        ${stat(fmtScore(d.best_hand), d.best_hand_name
          ? esc(d.best_hand_name) : "best hand")}
        ${stat(fmt(d.hands_played), "hands")}
      </div>
    </div>
    ${chases ? `<div class="chases">
       <div class="chtitle">On course to beat</div>${chases}${more}</div>` : ""}
    ${held ? `<div class="chases held">
       <div class="chtitle">On your board</div>${held}</div>` : ""}
   </div>`;
  el.querySelectorAll("button.seed").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); copySeed(b, b.dataset.seed); };
  });
  el.querySelector(".livebar").onclick = () => openRun(r.run_id);
  const tog = el.querySelector("#chtoggle");
  if (tog) {
    tog.onclick = ev => {
      ev.stopPropagation();
      chasesOpen = !chasesOpen;
      drawLive(d);                      // same payload, redrawn open
    };
  }
}

// ── wiring ───────────────────────────────────────────────────────────────

// Sprites must be loaded first or every option falls back to text.
Promise.all([
  fetch("/api/meta").then(r => r.json()),
  SPR_READY,
]).then(([m]) => {
  buildPicker("deck", "deck", m.decks, "b", 48, "All decks");
  buildPicker("stake", "stake",
    m.stakes.map(x => ({ k: x.k, n: nameOf(x.k) })), "s", 36, "All stakes");
});

// What the run table can be sorted by instead of by one of its columns.
// Four pickers rather than one long grouped list, but they all write the
// same state.metric -- only one can be active, so choosing in any of them
// clears the other three simply by no longer matching their options.
let METRICS = null;
const METRIC_PICKERS = [
  ["m_joker",       "joker",       "Joker",       j => nameOf(j)],
  ["m_hand_score",  "hand_score",  "Hand",        h => h],
  ["m_hand_level",  "hand_level",  "Hand",        h => h],
  ["m_hand_played", "hand_played", "Hand",        h => h],
];

function buildMetricPickers() {
  if (!METRICS) return;
  for (const [id, kind, placeholder, label] of METRIC_PICKERS) {
    const subjects = kind === "joker" ? METRICS.jokers : METRICS.hands;
    const art = kind === "joker"
      ? k => sprite(k, "j", 30)
      : h => sprite(planetOf(h), "j", 30);
    let opts = subjects.map(k => ({ k: `${kind}:${k}`, n: label(k), art: art(k) }));
    // A counter joker has no joker_scale rows, so it never appeared here
    // and the run list could not be sorted by one. It offers both of its
    // records, wearing the same seals the panels use to tell them apart.
    if (kind === "joker") {
      // Three peaks, not two: what it added while you held it, what the
      // counter reached while you did not, and the larger of the two. The
      // seals say which; the maximum wears none, because it is either.
      opts = opts.concat((METRICS.counters || []).flatMap(c => [
        { k: `counter:${c.metric}`, n: nameOf(c.key),
          art: `<span class="jart">${sprite(c.key, "j", 30)}${
            handIcon({ held: 1 })}</span>` },
        { k: `counter_unheld:${c.metric}`, n: nameOf(c.key),
          art: `<span class="jart">${sprite(c.key, "j", 30)}${
            handIcon({ held: 0 })}</span>` },
        { k: `counter_ambient:${c.metric}`, n: nameOf(c.key),
          art: sprite(c.key, "j", 30) },
      ])).sort((a, b) => a.n.localeCompare(b.n));
    }
    buildPicker(id, "metric", opts, "j", 30, placeholder, buildMetricPickers);
  }
}

Promise.all([fetch("/api/metrics").then(r => r.json()), SPR_READY])
  .then(([m]) => { METRICS = m; buildMetricPickers(); });

// Two independent toggles, like the phase filter: both on (or both off)
// means no filter, which is what "all runs" should mean and is not
// expressible with mutually exclusive buttons.
const seeded = { "0": true, "1": true };
function syncSeeded() {
  const on = Object.keys(seeded).filter(k => seeded[k]);
  state.seeded = on.length === 1 ? on[0] : "";
}
// Which of a counter joker's two records to include. Both on (or both
// off) means no filter, like the phase and seed pairs.
const heldSel = { "1": true, "0": true };
function syncHeld() {
  const on = Object.keys(heldSel).filter(k => heldSel[k]);
  state.held = on.length === 1 ? on[0] : "";
}
$("#heldg").onclick = e => {
  const b = e.target.closest("button.seg"); if (!b) return;
  heldSel[b.dataset.v] = !heldSel[b.dataset.v];
  b.setAttribute("aria-pressed", heldSel[b.dataset.v]);
  syncHeld(); refresh();
};

$("#seeded").onclick = e => {
  const b = e.target.closest("button.seg"); if (!b) return;
  seeded[b.dataset.v] = !seeded[b.dataset.v];
  b.setAttribute("aria-pressed", seeded[b.dataset.v]);
  syncSeeded(); refresh();
};

$("#noplasma").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  state.noplasma = on ? "1" : "";
  refresh();
};
$("#phase").onclick = e => {
  const b = e.target.closest("button.seg"); if (!b) return;
  phase[b.dataset.v] = !phase[b.dataset.v];
  b.setAttribute("aria-pressed", phase[b.dataset.v]);
  syncPhase(); refresh();
};
syncPhase();

// #run=<id> opens that run, optionally with #round=<n> expanded. Makes a run
// linkable, and means the dialog survives a reload.
async function openFromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const id = p.get("run");
  if (!id) return;
  await openRun(id);
  const rs = p.get("round");
  if (rs) {
    const tr = $(`#dbody tr.roundrow[data-round="${rs}"]`);
    if (tr) await toggleRound(id, tr);
  }
}
$("#detail").addEventListener("close", () => {
  if (location.hash) history.replaceState(null, "", location.pathname);
});

SPR_READY.then(refresh).then(openFromHash);

// The server watches the log directory and folds in whatever changes, so a run
// finished in Balatro shows up here on its own. Poll a counter rather than the
// data: it is one tiny query, and re-rendering only on a real change avoids
// yanking the page out from under someone mid-read.
//
// Exactly one timer, at page scope. An earlier version had this block pasted
// into each filter handler as well, so every filter change started another
// permanent poller.
let seenGeneration = null;
setInterval(async () => {
  if (document.hidden) return;
  try {
    const v = await fetch("/api/version").then(r => r.json());
    if (seenGeneration === null) { seenGeneration = v.generation; return; }
    if (v.generation !== seenGeneration) {
      seenGeneration = v.generation;
      await refresh();
      const sub = $("#sub");
      sub.classList.remove("fresh");
      void sub.offsetWidth;          // restart the animation
      sub.classList.add("fresh");
    }
  } catch { /* server gone; keep showing what we have */ }
}, 3000);
</script>
