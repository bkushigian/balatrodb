<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BalatroDB</title>
<style>
/* Balatro's own typeface, lifted out of the game archive by
   ingest/extract_assets.py. The stylesheet had always asked for "m6x11"
   first and nothing ever served it, so every page fell back to Courier. */
@font-face {
  font-family: "m6x11";
  src: url("assets/m6x11plus.ttf") format("truetype");
  font-display: swap;
}
/* Balatro's own palette, lifted from G.C in globals.lua:
   MULT/RED FE5F55 · MONEY f3b958 · GOLD eac058 · FILTER ff9a00
   PURPLE 8867a5 · JOKER_GREY bfc7d5 · MAIN/DARK 374244 · BLIND_SIZE ad5353 */
:root {
  --bg:        #1b2223;
  --surface:   #374244;   /* G.C.MAIN */
  --raised:    #455254;
  --sunken:    #222b2c;
  --ink:       #ffffff;
  --ink-dim:   #bfc7d5;   /* G.C.JOKER_GREY */
  --ink-mute:  #8b969b;
  --mult:      #fe5f55;   /* G.C.MULT */
  --chips:     #009dff;
  --money:     #f3b958;   /* G.C.MONEY */
  --gold:      #eac058;   /* G.C.GOLD */
  --filter:    #ff9a00;   /* G.C.FILTER */
  --purple:    #8867a5;   /* G.C.PURPLE */
  --green:     #4bc292;
  --blind:     #ad5353;   /* G.C.BLIND_SIZE */
  --r: 0.45rem;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 16px 64px;
  background: var(--bg); color: var(--ink);
  font: 20px/1.5 "m6x11", "Courier New", ui-monospace, monospace;
  /* A pixel font wants no antialiasing -- smoothing rounds the corners off
     every glyph and the whole page reads soft. */
  -webkit-font-smoothing: none;
  font-smooth: never;
  /* m6x11 ships one weight. Without this the browser fakes bold by smearing
     each glyph sideways, which at 14px welded the letters of "DIED" into a
     solid block. Every font-weight:700 below now just draws the real face. */
  font-synthesis: none;
  font-synthesis-weight: none;
}
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: .02em; }
/* Panel titles wear the game's outlined lettering. */
h2 { --stroke: #1b2325; color: #fff;
     text-shadow: var(--sh-x, 2px) var(--sh-y, 2px) 0 var(--stroke); }
a { color: var(--chips); }

/* Balatro's chunky embossed panel: a lip of darker colour under each block */
.panel {
  background: var(--surface); border-radius: var(--r);
  box-shadow: 0 4px 0 #222b2c, 0 5px 10px rgba(0,0,0,.35);
  padding: 14px 16px;
}
header {
  max-width: 1560px; margin: 0 auto; padding: 22px 0 14px;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
header h1 { font-size: 38px; }
header h1 span { color: var(--mult); }
header .sub { color: var(--ink-mute); font-size: 15px; }
/* brief pulse when new runs arrive, so an update is noticed without a banner
   that shifts the layout */
@keyframes flash { from { color: var(--gold); } to { color: var(--ink-mute); } }
header .sub.fresh { animation: flash 1.6s ease-out; }
@media (prefers-reduced-motion: reduce) { header .sub.fresh { animation: none; } }
main { max-width: 1560px; margin: 0 auto; display: grid; gap: 16px; }
/* A grid item's min-width defaults to `auto`, so a panel would not shrink
   below the intrinsic width of the table inside it -- it pushed the grid
   wider than the viewport and put a horizontal scrollbar on the whole page
   instead of on the one table that needed it. The tables already scroll
   themselves via .scroll. */
main > *, .cols > * { min-width: 0; }

/* ── filters: one row above everything, per the interaction spec ───────── */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters label { color: var(--ink-dim); font-size: 15px; margin-right: 4px; }
/* The lettering carries a hard offset shadow rather than an outline all
   the way round -- measured off balatrowiki.org, where every brown pixel is
   the white glyph shifted +3,+4 and nothing sits above or to the left. At
   our smaller type that scales to 2px; the chips use 1px. */

/* ── Balatro's button ──────────────────────────────────────────────────
   Taken off balatrowiki.org, whose buttons are a solid pill with a 1px
   lighter band at the top, a ~4px darker lip at the bottom, and white text
   carrying a heavy dark outline. Measured from a vertical slice through one
   of theirs: #fcac3d highlight, #ff9500 fill, #ad7442 lip, #784600 text
   outline. Rebuilt here in the game's dark palette rather than the wiki's
   light one, so it still reads as the same family. */
/* The stair-stepped silhouette, traced off a balatrowiki.org button: the
   fill is inset 12px, 6px then 3px over the first 12px of height, mirrored
   on all four corners. clip-path would cut off a box-shadow, so the
   highlight and the lip are bands in a background gradient and the drop
   shadow is a filter, which follows the clipped outline instead of the box. */
/* ── the pixel pill ───────────────────────────────────────────────────
   The lip is a SECOND COPY of the silhouette sitting behind and a few
   pixels lower, the way the game draws it -- not a dark band inside the
   shape. As a band it cut the fill off with a flat horizontal line and
   then painted the bottom curve in the lip colour, which is backwards:
   the fill should keep its stepped curve, and the lip should peek out
   below it. Two pseudo-elements, because clip-path on the element itself
   would clip them both to the body's outline. */
.pixel-pill {
  --lip-h: 4px;
  --hi: rgba(255, 255, 255, .14);
  --lip: rgba(0, 0, 0, .45);                          /* fallback */
  --lip: color-mix(in srgb, var(--fill) 58%, #000);   /* a darker own colour */
  --shape: polygon(
    12px 0, calc(100% - 12px) 0,
    calc(100% - 12px) 3px, calc(100% - 6px) 3px,
    calc(100% - 6px) 6px, calc(100% - 3px) 6px,
    calc(100% - 3px) 12px, 100% 12px,
    100% calc(100% - 12px), calc(100% - 3px) calc(100% - 12px),
    calc(100% - 3px) calc(100% - 6px), calc(100% - 6px) calc(100% - 6px),
    calc(100% - 6px) calc(100% - 3px), calc(100% - 12px) calc(100% - 3px),
    calc(100% - 12px) 100%, 12px 100%,
    12px calc(100% - 3px), 6px calc(100% - 3px),
    6px calc(100% - 6px), 3px calc(100% - 6px),
    3px calc(100% - 12px), 0 calc(100% - 12px),
    0 12px, 3px 12px, 3px 6px, 6px 6px, 6px 3px, 12px 3px);
  position: relative;
  isolation: isolate;
  background: none;
  border-radius: 0;
}
.pixel-pill::before, .pixel-pill::after {
  content: ""; position: absolute; inset: 0;
  clip-path: var(--shape);
}
.pixel-pill::before {          /* the lip, the same shape sitting lower */
  background: var(--lip);
  transform: translateY(var(--lip-h));
  z-index: -2;
}
.pixel-pill::after {           /* the body */
  background: linear-gradient(to bottom, var(--hi) 0 2px, var(--fill) 2px 100%);
  z-index: -1;
}
/* Chips and seeds round all the way to a pill instead of stopping a few
   pixels in. The steps approximate a quarter circle of radius = half the
   height, so the bands are given as percentages and keep their shape
   whatever the element's height:
       y   0%  11%  22%  39%  50%
     inset 12   5    2    1    0  (px)
   which is the staircase a pixel artist would draw for that curve. */
.pixel-pill.sm { --lip-h: 3px; --shape: polygon(
    12px 0, calc(100% - 12px) 0,
    calc(100% - 12px) 11%, calc(100% - 5px) 11%,
    calc(100% - 5px) 22%, calc(100% - 2px) 22%,
    calc(100% - 2px) 39%, 100% 39%,
    100% 61%, calc(100% - 2px) 61%,
    calc(100% - 2px) 78%, calc(100% - 5px) 78%,
    calc(100% - 5px) 89%, calc(100% - 12px) 89%,
    calc(100% - 12px) 100%, 12px 100%,
    12px 89%, 5px 89%,
    5px 78%, 2px 78%,
    2px 61%, 0 61%,
    0 39%, 2px 39%,
    2px 22%, 5px 22%,
    5px 11%, 12px 11%); }

button.seg, .pick > button {
  --stroke: #10171a;
  --fill: var(--sunken);
  border: 0; cursor: pointer;
  padding: 13px 20px; font: inherit; font-size: 17px;
  font-weight: 700; letter-spacing: .02em;
  color: #fff;
  text-shadow: var(--sh-x, 2px) var(--sh-y, 2px) 0 var(--stroke);
  transition: transform .06s;
}
/* Pressing pushes the button down onto its own lip, which all but vanishes. */
button.seg:active, .pick > button:active {
  transform: translateY(3px);
  --lip-h: 1px;
}
button:focus-visible { outline: 2px solid var(--filter); outline-offset: 2px; }
.seggroup { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
/* Deck and stake are picked by their own art rather than by name -- the
   sprite is what you recognise, and five decks of buttons take less room
   than a dropdown you have to open to read. */
/* A dropdown that shows the card art. A native <select> cannot, and laying
   every deck out as a button would not survive the full set of them. */
.pick { position: relative; display: inline-block; vertical-align: middle; }
.pick > button { display: inline-flex; align-items: center; gap: 7px; }
.pick .caret { color: var(--ink-mute); font-size: 14px; }
.pick .menu {
  position: absolute; z-index: 40; top: calc(100% + 5px); left: 0; display: none;
  background: var(--surface); border: 1px solid #4a585c; border-radius: .4rem;
  padding: 4px; min-width: 100%; max-height: 340px; overflow-y: auto;
  box-shadow: 0 8px 22px rgba(0,0,0,.5);
}
.pick.open .menu { display: grid; gap: 2px; }
.pick .menu button {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  background: transparent; border: 0; box-shadow: none; color: var(--ink);
  font: inherit; font-size: 17px; padding: 7px 11px; border-radius: .3rem;
  cursor: pointer; white-space: nowrap;
}
.pick .menu button:hover, .pick .menu button:focus-visible { background: var(--sunken); }
.pick .menu button[aria-selected="true"] {
  --stroke: #7a241e; --sh-x: 1px; --sh-y: 1px;
  background: var(--mult); color: #fff; font-weight: 700;
  text-shadow: var(--sh-x, 2px) var(--sh-y, 2px) 0 var(--stroke);
}
button.seg[aria-pressed="true"] {
  --stroke: #7a241e;
  --fill: var(--mult);
  --hi: rgba(255, 255, 255, .26);
}

/* ── stat tiles: hero numbers, no chart ───────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px 14px;
        box-shadow: 0 4px 0 #222b2c; }
.tile .k { color: var(--ink-mute); font-size: 15px; text-transform: uppercase; letter-spacing: .08em; }
.tile .v { font-size: 38px; font-weight: 700; line-height: 1.15; margin-top: 4px;
           overflow-wrap: anywhere; }
.tile .n { color: var(--ink-dim); font-size: 14px; margin-top: 2px; }
.v.mult { color: var(--mult); } .v.money { color: var(--money); }
.v.chips { color: var(--chips); } .v.gold { color: var(--gold); }
.v.purple { color: var(--purple); } .v.green { color: var(--green); }

/* ── tables ───────────────────────────────────────────────────────────── */
/* Exactly two columns once there is room, rather than as many as fit: with
   auto-fit a wide window gave three, which left the fourth panel alone on a
   row with a hole beside it. */
.cols { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }
/* A column of panels inside one `cols` cell, so the tall Jokers board can
   sit beside two shorter tables rather than leaving a gap under a short one. */
.stack { display: grid; gap: 16px; align-content: start; }
.runsort { display: flex; align-items: center; gap: 14px; margin: 2px 0 12px;
           flex-wrap: wrap; }
.runsort > label { color: var(--ink-dim); font-size: 15px; }
.mpick { display: flex; align-items: center; gap: 7px; }
.mlab { color: var(--ink-mute); font-size: 13px; letter-spacing: .05em;
        text-transform: uppercase; }
.pick .menu .grp { padding: 7px 9px 3px; color: var(--ink-mute); font-size: 13px;
                   letter-spacing: .06em; text-transform: uppercase; }
/* One row pitch everywhere. Rows are as tall as their tallest sprite, so
   without this a table with card art sat at a different rhythm from one
   without -- which is what made two panels of ten rows end at different
   heights. */
tbody td { height: 82px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 19px; }
th {
  text-align: left; color: var(--ink-mute); font-size: 15px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px 8px;
  white-space: nowrap; position: sticky; top: 0; background: var(--surface);
}
td { padding: 6px 8px; border-top: 1px solid #2b3536; white-space: nowrap; }
tbody tr:hover { background: #404d4f; }
td.num, th.num { text-align: right; }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable:hover { color: var(--ink); }
th.sortable .ind { display: inline-block; width: .8em; color: var(--gold); }

/* The seed, as something you press. It is the one cell people want to take
   somewhere else, so it copies on click rather than needing a careful drag. */
.seed { font: inherit; font-size: 15px; letter-spacing: .06em; cursor: pointer;
        color: var(--ink-dim); border: 0; font-weight: 700;
        padding: 7px 16px; --fill: var(--sunken);
        transition: color .12s, transform .06s; }
.seed:active { transform: translateY(2px); --lip-h: 1px; }
.seed:hover { --fill: #40525a; color: var(--ink); }
.seed.seeded { color: var(--gold); }
.seed.copied { --fill: var(--green); color: #14211f; }
td.num { font-variant-numeric: tabular-nums; }
.chip {
  display: inline-block; padding: 4px 13px;
  font-size: 14px; font-weight: 700; letter-spacing: .06em; color: #1b2223;
  /* text-shadow inherits, and the run dialog's chips sit inside its <h2>,
     which carries the outlined lettering. A dark outline around dark text
     on a gold chip filled the letters in solid. */
  text-shadow: none;
  /* Fill only; .pixel-pill darkens it for the lip, so a new chip colour
     needs nothing but its own --fill. */
  --fill: #4a585c;
  --hi: rgba(255, 255, 255, .20);
}
.chip.win { --fill: var(--gold); }
.chip.died { --fill: var(--blind); color: #fff; }
.chip.endless { --fill: var(--purple); color: #fff; }
.chip.susp { --fill: #566264; color: var(--ink-dim); }
.chip.live { --fill: var(--green); }
.chip.other { --fill: #4a585c; color: var(--ink-dim); }
.muted { color: var(--ink-mute); }
/* Sprites are cells of the game's own atlases, positioned with
   background-position. Scaled by background-size so one rule covers any
   display size. */
.spr { display: inline-block; vertical-align: middle; background-repeat: no-repeat;
       image-rendering: pixelated; flex: none; }
.spr.j { width: 30px; height: 40px; }
.spr.b { width: 26px; height: 35px; }
.spr.s { width: 20px; height: 20px; }
.namecell { display: flex; align-items: center; gap: 8px; }
.sub2 { color: var(--ink-mute); font-size: 14px; }
.deckcell { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.clickable { cursor: pointer; }

/* ── single-series bar chart: ante distribution ───────────────────────── */
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 54px 1fr 34px; align-items: center; gap: 8px; }
.bar .track { background: var(--sunken); border-radius: 3px; height: 15px;
               display: block; overflow: hidden; }
.bar .fill { background: var(--chips); height: 100%; border-radius: 0 3px 3px 0;
             min-width: 3px; display: block; }
.bar .lab, .bar .cnt { color: var(--ink-dim); font-size: 12px; }
.bar .cnt { text-align: right; font-variant-numeric: tabular-nums; }

/* ── run detail drawer ────────────────────────────────────────────────── */
dialog {
  background: var(--surface); color: var(--ink); border: 0; border-radius: var(--r);
  max-width: min(960px, 94vw); width: 100%; padding: 0;
  box-shadow: 0 10px 0 #222b2c, 0 20px 50px rgba(0,0,0,.6);
}
dialog::backdrop { background: rgba(10,14,15,.72); }
dialog .head { display: flex; justify-content: space-between; align-items: center;
               padding: 14px 18px; border-bottom: 1px solid #2b3536; gap: 12px; }
dialog .body { padding: 16px 18px; max-height: 72vh; overflow: auto; }
dialog h3 { font-size: 16px; color: var(--ink-mute); text-transform: uppercase;
            letter-spacing: .07em; margin: 16px 0 6px; }
dialog h3:first-child { margin-top: 0; }
/* Same pill as the filter buttons, so the dialog matches the page. */
button.x { --stroke: #10171a; --fill: var(--sunken);
           color: #fff; border: 0; font: inherit;
           padding: 13px 20px; cursor: pointer;
           font-weight: 700;
           text-shadow: var(--sh-x, 2px) var(--sh-y, 2px) 0 var(--stroke);
           transition: transform .06s; }
button.x:active { transform: translateY(3px); --lip-h: 1px; }
.empty { color: var(--ink-mute); padding: 14px 4px; }

/* expandable round timeline */
tr.roundrow td:first-child::before {
  content: ""; display: inline-block; width: 0; height: 0; margin-right: 6px;
  border: 4px solid transparent; border-left-color: var(--ink-mute);
  transition: transform .12s; transform-origin: 2px 50%;
}
tr.roundrow.open td:first-child::before { transform: rotate(90deg); }
tr.detail > td { padding: 0; border-top: 0; }
.steps { background: var(--sunken); border-radius: .3rem; margin: 2px 0 8px;
         padding: 8px 10px; display: grid; gap: 6px; }
/* 74px could not hold "Five of a Kind" plus its level, and an overflowing
   grid track is not clipped -- the name ran out under the cards. Wider, and
   the name wraps with the level on its own line. */
.step { display: grid; grid-template-columns: 104px 1fr auto; gap: 10px;
        align-items: center; padding: 5px 6px; border-radius: .25rem; }
.step.play { background: #2c393b; }
.step .what { font-size: 18px; font-weight: 700; line-height: 1.25;
              overflow-wrap: anywhere; }
.step .what .jv { display: block; font-weight: 400; }
.step.play .what { color: var(--chips); }
.step.discard .what { color: var(--ink-mute); }
.hand { display: flex; gap: 3px; align-items: center; flex-wrap: wrap;
        min-width: 0; }

/* ── playing cards ────────────────────────────────────────────────────────
   A card is two atlas cells stacked: the base (plain white c_base, or an
   enhancement like m_lucky) with the 8BitDeck rank/suit face on top. */
.pcard { position: relative; display: inline-block; line-height: 0;
         vertical-align: middle; border-radius: 3px; }
.pcard .face { position: absolute; left: 0; top: 0; }
/* Editions are shaders in-game with no atlas cell, so these are CSS
   approximations -- enough to tell a foil from a polychrome at a glance.
   The card's title attribute names the real one. */
.pcard.ed::after { content: ""; position: absolute; inset: 0; border-radius: 3px;
                   pointer-events: none; mix-blend-mode: screen; opacity: .55; }
.pcard.ed-foil::after   { background: linear-gradient(120deg, #2b6cff, #8fd8ff 60%, #2b6cff); }
.pcard.ed-holo::after   { background: linear-gradient(120deg, #ff4fd8, #7a4bff 60%, #ff4fd8); }
.pcard.ed-polychrome::after { background: linear-gradient(120deg,
        #ff5c5c, #ffd84f 25%, #63ff8f 50%, #4fd8ff 75%, #c06cff); }
.pcard.ed-negative::after { background: #2a2350; mix-blend-mode: exclusion; opacity: .85; }
/* Seals have no `pos` in the game's data, so there is no cell to blit --
   a corner pip in the seal's colour stands in for it. */
.pcard .seal { position: absolute; left: 1px; top: 50%; margin-top: -3px;
               width: 5px; height: 5px;
               border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.55); }
.seal.gold { background: #e8c547; } .seal.red { background: #fe5f55; }
.seal.blue { background: #009dff; } .seal.purple { background: #8867a6; }
.step .score { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.step .score b { color: var(--mult); }
.step .score span { color: var(--ink-mute); font-size: 16px; }
/* The board: state going into the round, not an action. Jokers are only
   sampled when a hand is played, so the values shown are those after the
   round's first scored hand -- the lineup is the point. */
.board { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
         background: var(--sunken); border-radius: .3rem;
         padding: 6px 10px; margin: 2px 0 6px; }
.board .lbl { color: var(--ink-mute); font-size: 14px; letter-spacing: .06em;
              text-transform: uppercase; margin-right: 2px; }
.bj { display: inline-flex; flex-direction: column; align-items: center; }
/* The board is sprites, and a sprite can be wrong: Balatro stores Wee Joker
   at the same atlas cell as Joker, so without a name it looks like a joker
   you do not have and the one you do have looks absent. */
/* The game's own colour language: chips blue, mult red, money gold. */
.sc { font-size: 15px; font-weight: 700; margin-top: 1px; white-space: nowrap; }
.sc-chips { color: var(--chips); }
.sc-mult  { color: var(--mult); }
.sc-money { color: var(--money); }
.sc-hand  { color: var(--ink-dim); }
.sc-other { color: var(--ink-dim); }
.bjn { font-size: 13px; color: var(--ink-dim); max-width: 74px; text-align: center;
       line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
.moved { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
         width: 100%; margin-top: 2px; opacity: .85; }
.moved .bj { flex-direction: row; gap: 5px; align-items: center; }
.moved .sc { margin-top: 0; }
.cash { display: block; color: var(--money); font-size: 15px; font-weight: 700; }
.jv { color: var(--ink-dim); font-size: 15px; }
.warn { color: var(--filter); font-size: 15px; }
@media (max-width: 560px) { header h1 { font-size: 24px; } .tile .v { font-size: 25px; } }
</style>
</head>
<body>
<header>
  <h1>Balatro<span>DB</span></h1>
  <div class="sub" id="sub">loading…</div>
</header>

<main>
  <section class="panel filters" aria-label="Filters">
    <span><label>Deck</label><span class="pick" id="deck"></span>
      <button class="seg pixel-pill" id="noplasma" aria-pressed="false"
        title="Plasma balances chips and mult before scoring, so its numbers are not comparable with other decks">No Plasma</button></span>
    <span><label>Stake</label><span class="pick" id="stake"></span></span>
    <span><label>Include</label>
      <span class="seggroup" id="phase" role="group" aria-label="Which phases to include">
        <button class="seg pixel-pill" data-v="0" aria-pressed="true"
          title="Everything up to the point a run continued past the win ante">Non-endless</button>
        <button class="seg pixel-pill" data-v="1" aria-pressed="true"
          title="Only what happened after continuing past the win ante">Endless</button>
      </span></span>
  </section>

  <section class="tiles" id="tiles" aria-label="Records"></section>

  <!-- One grid, not a tall column beside a stack of three: the panels are
       all leaderboards of the same shape, so letting them flow two-up keeps
       their bottoms near each other instead of running one column far past
       the other. -->
  <section class="cols">
    <div class="panel">
      <h2>Jokers</h2>
      <div class="scroll"><table id="jokers"></table></div>
    </div>

    <div class="panel">
      <h2>Best hand by type</h2>
      <div class="scroll"><table id="hands"></table></div>
    </div>

    <div class="panel">
      <h2>Highest hand levels</h2>
      <div class="scroll"><table id="handlevels"></table></div>
    </div>

    <div class="panel">
      <h2>Most played hands</h2>
      <div class="scroll"><table id="handcounts"></table></div>
    </div>
  </section>

  <section class="panel">
    <h2>Runs</h2>
    <div class="runsort"><label>Sort by</label>
      <span class="mpick"><span class="mlab">Joker scores</span><span class="pick" id="m_joker"></span></span>
      <span class="mpick"><span class="mlab">Hand scores</span><span class="pick" id="m_hand_score"></span></span>
      <span class="mpick"><span class="mlab">Hand levels</span><span class="pick" id="m_hand_level"></span></span>
      <span class="mpick"><span class="mlab">Hands played</span><span class="pick" id="m_hand_played"></span></span>
    </div>
    <div class="scroll"><table id="runs"></table></div>
  </section>
</main>

<dialog id="detail"><div class="head"><h2 id="dtitle">Run</h2>
  <button class="x pixel-pill" onclick="detail.close()">Close</button></div>
  <div class="body" id="dbody"></div></dialog>

<script>
const $ = s => document.querySelector(s);

// Everything rendered here came out of a log file, and a log can carry a
// modded deck or joker name verbatim. These strings go into innerHTML, so they
// are escaped at the point of interpolation rather than trusted.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Two independent toggles rather than three exclusive options. Both on (or
// both off) means no phase filter at all -- which is what "all runs" should
// mean, and is not expressible with mutually exclusive buttons.
const phase = { "0": true, "1": true };
const state = { deck: "", stake: "", endless: "", noplasma: "", metric: "" };

function syncPhase() {
  const on = Object.keys(phase).filter(k => phase[k]);
  // exactly one selected -> filter to it; otherwise include everything
  state.endless = on.length === 1 ? on[0] : "";
}

// Big numbers arrive as exact decimal text and can exceed Number range, so
// format from the string rather than parseFloat where possible.
// Past ten billion the digits stop being readable and only the magnitude
// means anything, so numbers switch to A.BBe12 there.
const EXP_AT = 1e10;

// A value the log carries but a double cannot hold. These arrive as exact
// decimal strings -- either a very long run of digits or already in
// exponential form -- so the exponent is counted off the string rather than
// computed, which would have overflowed to Infinity.
const sciFromString = str => {
  const m = /^([+-]?)(\d+)(?:\.(\d+))?(?:[eE]([+-]?\d+))?$/.exec(str);
  if (!m) return null;
  const [, sign, int, frac = "", exp] = m;
  const lead = int.replace(/^0+/, "");
  const digits = (lead + frac) || "0";
  const e = Math.max(lead.length - 1, 0) + (exp ? Number(exp) : 0);
  return `${sign}${digits[0]}.${digits.slice(1, 3).padEnd(2, "0")}e${e}`;
};

const fmtNum = (v, whole) => {
  if (v === null || v === undefined || v === "") return "—";
  const str = String(v).trim();
  const n = Number(str);
  if (!isFinite(n)) {
    // Escaped: fmt is handed TEXT columns straight out of the log
    // (score_txt, to_txt, required_txt), and a modded joker can put
    // anything in them. Every caller interpolates into innerHTML.
    return sciFromString(str) ?? esc(str);
  }
  if (Math.abs(n) >= EXP_AT) return n.toExponential(2).replace("e+", "e");
  // Balatro scores in whole chips, so a .75 is an artefact of the maths
  // rather than something the player saw. Truncated, not rounded: rounding
  // up would report more than was actually scored.
  if (whole) return Math.trunc(n).toLocaleString();
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
};

const fmt = v => fmtNum(v, false);
// Scores and chip requirements: whole numbers only.
const fmtScore = v => fmtNum(v, true);
const ago = ts => {
  if (!ts) return "—";
  const d = new Date(ts * 1000), s = (Date.now() / 1000) - ts;
  if (s < 86400) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
};

// Atlas metadata, extracted from the game by ingest/extract_assets.py. Absent
// if that has not been run, in which case everything falls back to text.
let SPR = null;
// Awaited rather than raced: the pickers, the joker names and the hand
// strength sort all read it, and losing the race left them silently inert.
const SPR_READY = fetch("assets/sprites.json")
  .then(r => (r.ok ? r.json() : null))
  .then(d => { SPR = d; })
  .catch(() => {});

function sprite(key, kind, px) {
  if (!SPR || !SPR.sprites || !key || !SPR.sprites[key]) return "";
  const s = SPR.sprites[key], a = SPR.atlases[s.a];
  if (!a) return "";
  const scale = px / a.cw;
  // Playing-card layers carry their own combined title on the wrapper.
  const tip = kind.startsWith("pc") ? "" : ` title="${esc(key)}"`;
  return `<span class="spr ${kind}"${tip} style="
      width:${px}px; height:${(a.ch * scale).toFixed(1)}px;
      background-image:url(assets/${s.a});
      background-size:${(a.w * scale).toFixed(1)}px ${(a.h * scale).toFixed(1)}px;
      background-position:-${(s.x * a.cw * scale).toFixed(1)}px -${(s.y * a.ch * scale).toFixed(1)}px"></span>`;
}

// The game's own display names, from localization/en-us.lua. Without them a
// key has to be un-snake-cased, which gives "ride the bus" and "mail in
// rebate" -- and mixed casing against the panels that do have real names.
// Poker hands sort by strength, not alphabetically -- "Flush Five" belongs
// above "High Card", not next to it. The ranking is the game's own, from
// evaluate_poker_hand; anything unrecognised sorts last.
const handRank = hand => {
  const o = (SPR && SPR.hand_order) || [];
  const i = o.indexOf(hand);
  return i < 0 ? null : o.length - i;
};

// The Planet card that levels a hand, from the game's own centre data. It
// gives the hand panels real art, and with it their rows match the joker
// rows' height instead of sitting at a different rhythm.
// A scaling value, written the way the game writes it: chips blue and
// additive, mult red and additive, X-mult red with the X. Only jokers that
// are actually accumulating get one -- a static `extra` is not a score.
const SCALE = {
  chips:       ["sc-chips", "+", ""],
  mult:        ["sc-mult",  "+", ""],
  x_mult:      ["sc-mult",  "X", ""],
  h_size:      ["sc-hand",  "+", " hand"],
  extra_value: ["sc-money", "+$", ""],
};
const scaleTag = sc => {
  if (!sc || sc.value === null || sc.value === undefined) return "";
  const [cls, pre, post] = SCALE[sc.field] || ["sc-other", "+", ""];
  return `<span class="sc ${cls}" title="${esc(sc.field)}"
    >${pre}${fmt(sc.value)}${post}</span>`;
};

const handCell = h => `<span class="namecell">${
  sprite((SPR && SPR.hand_planets && SPR.hand_planets[h]) || "", "j", 56)
  }<span>${esc(h)}</span></span>`;

const nameOf = (key, fallback) =>
  (SPR && SPR.names && SPR.names[key]) || fallback ||
  (key || "").replace(/^(j|b|m|c)_/, "").replace(/_/g, " ");

// Deck and stake are shown as their sprite alone; the name is a hover. The
// icon is the thing you actually recognise, and the text was repeated down
// every row of every panel.
const deckCell = r => r.deck_key
  ? `<span class="deckcell" title="${esc(nameOf(r.deck_key, r.deck_name))}">${
      sprite(r.deck_key, "b", 48) ||
      `<span class="muted">${esc(r.deck_name || r.deck_key)}</span>`}</span>`
  : `<span class="muted">—</span>`;
const stakeCell = r => r.stake_key
  ? `<span class="deckcell" title="${esc(nameOf(r.stake_key))}">${
      sprite(r.stake_key, "s", 36) ||
      `<span class="muted">${esc(r.stake_key.replace("stake_", ""))}</span>`}</span>`
  : `<span class="muted">—</span>`;

// ── sortable tables ──────────────────────────────────────────────────────
// Each panel declares its columns once: how to render a cell, and what to
// sort it by. Sorting works on the row objects rather than the rendered DOM,
// so a big score sorts by its ordering key and not by its digits as text.
const TBL = {};

function defineTable(id, cols, opts) {
  const o = opts || {};
  TBL[id] = { id, cols, rows: [], empty: o.empty || "Nothing yet.",
              onclick: o.onclick,
              sort: { i: o.sort === undefined ? null : o.sort, dir: -1 } };
}

function setRows(id, rows) { TBL[id].rows = rows || []; drawTable(id); }

function sortKey(t, r) {
  const c = t.cols[t.sort.i];
  const v = c.sort ? c.sort(r) : null;
  return v === undefined ? null : v;
}

function drawTable(id) {
  const t = TBL[id], el = document.getElementById(id);
  if (!el) return;
  const head = t.cols.map((c, i) => {
    const on = t.sort.i === i;
    const dir = on ? (t.sort.dir < 0 ? "descending" : "ascending") : "none";
    return `<th class="${c.num ? "num " : ""}sortable" data-i="${i}"
      aria-sort="${dir}"${c.title ? ` title="${esc(c.title)}"` : ""}
      >${esc(c.label)}<span class="ind">${on ? (t.sort.dir < 0 ? "▾" : "▴") : ""}</span></th>`;
  }).join("");

  let rows = t.rows.slice();
  if (t.sort.i !== null) {
    rows.sort((a, b) => {
      const x = sortKey(t, a), y = sortKey(t, b);
      // Missing values always sort last, whichever way the column is pointing.
      if (x === null && y === null) return 0;
      if (x === null) return 1;
      if (y === null) return -1;
      const d = typeof x === "string" || typeof y === "string"
        ? String(x).localeCompare(String(y)) : (x - y);
      return d * t.sort.dir;
    });
  }

  const body = rows.length ? rows.map(r => {
    // The run id goes in a data attribute, not into JS source inside an
    // onclick. esc() is HTML escaping: the parser decodes &#39; back to an
    // apostrophe BEFORE the JS is parsed, so it never protected a string
    // literal. A delegated listener sidesteps the whole question.
    const click = t.onclick ? ` class="clickable" data-run="${esc(r.run_id)}"` : "";
    return `<tr${click}>` + t.cols.map(c =>
      `<td class="${[c.num ? "num" : "", c.cls || ""].filter(Boolean).join(" ")}"${
        c.style ? ` style="${c.style}"` : ""}>${c.cell(r)}</td>`).join("") + `</tr>`;
  }).join("")
    : `<tr><td colspan="${t.cols.length}" class="empty">${esc(t.empty)}</td></tr>`;

  el.innerHTML = `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>`;
  if (t.onclick) {
    el.querySelectorAll("tbody tr.clickable").forEach(tr => {
      tr.onclick = () => openRun(tr.dataset.run);
    });
  }
  el.querySelectorAll("button.seed").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); copySeed(b, b.dataset.seed); };
  });
  el.querySelectorAll("th.sortable").forEach(th => {
    th.onclick = () => {
      const i = +th.dataset.i;
      // Sorting by a column and sorting by a joker/hand metric are
      // alternatives: picking one drops the other. Clicking the metric's own
      // column just flips its direction.
      if (t.onHeaderSort && t.onHeaderSort(i)) return;
      // First click on a column sorts descending -- for these panels the
      // interesting end is almost always the top.
      if (t.sort.i === i) t.sort.dir = -t.sort.dir;
      else { t.sort.i = i; t.sort.dir = -1; }
      drawTable(id);
    };
  });
}

// Click to copy, with the seed itself as the confirmation.
function copySeed(el, seed) {
  const done = ok => {
    const was = el.textContent;
    el.textContent = ok ? "COPIED" : "PRESS ⌘C";
    el.classList.toggle("copied", ok);
    setTimeout(() => { el.textContent = was; el.classList.remove("copied"); }, 1100);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(seed).then(() => done(true), () => done(false));
    return;
  }
  // http://localhost is a secure context in Chrome but not everywhere, so
  // fall back rather than silently doing nothing.
  const ta = document.createElement("textarea");
  ta.value = seed; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  done(ok);
}

const seedCell = r => r.seed
  ? `<button class="seed pixel-pill sm${r.seeded ? " seeded" : ""}" data-seed="${esc(r.seed)}"
       title="${r.seeded ? "Entered seed — " : ""}Click to copy"
       >${esc(r.seed)}</button>`
  : `<span class="muted">—</span>`;
const shortRun = r => (r || "").split("-")[1] || r;

const qs = () => {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v !== "") p.set(k, v);
  return p.toString();
};
const get = path => fetch(path + "?" + qs()).then(r => {
  if (!r.ok) throw new Error(`${path} -> ${r.status}`);
  return r.json();
}).then(d => {
  // The server answers errors with a 200 and {"error": ...}; without this
  // the object flowed on and rendered as "undefined runs".
  if (d && d.error) throw new Error(`${path}: ${d.error}`);
  return d;
});

function resultChip(r) {
  // No run.end yet: either still being played, or the game crashed. The log
  // grows as you play, so this row updates live.
  if (!r.result) return `<span class="chip pixel-pill sm live">IN PROGRESS</span>`;

  // Winning and ending are different facts. Beating the win ante is a win
  // even if the run later died in endless, so both are shown rather than the
  // win hiding the ending -- which read as "you won" on a run that lost.
  // "loss" is the older spelling of "died"; both appear in the corpus.
  const CHIP = {
    died:      ["died", "DIED"],
    loss:      ["died", "DIED"],
    suspended: ["susp", "PAUSED"],
    quit:      ["susp", "QUIT"],
    new_run:   ["other", "RESTARTED"],
    completed: null,                 // finished after winning: the WON says it
    unknown:   ["other", "UNKNOWN"],
  }[r.result];

  const out = [];
  if (r.won) out.push(`<span class="chip pixel-pill sm win">WON</span>`);
  if (CHIP) out.push(`<span class="chip pixel-pill sm ${CHIP[0]}">${CHIP[1]}</span>`);
  else if (!r.won) out.push(`<span class="muted">${esc(r.result)}</span>`);
  return out.join(" ");
}

// ── panel definitions ────────────────────────────────────────────────────
// Marks a table's rows as openable; the handler is attached in drawTable.
const openRunJS = true;
const jokerCell = r => `<span class="namecell">${sprite(r.key, "j", 56)}
  <span>${esc(nameOf(r.key))}${r.what
    ? `<br><span class="sub2">${esc(r.what)}</span>` : ""}</span></span>`;

defineTable("jokers", [
  { label: "Joker", cell: jokerCell, sort: r => nameOf(r.key) },
  { label: "Peak", num: true, style: "color:var(--mult);font-weight:700",
    cell: r => fmt(r.value), sort: r => r.ord },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
], { empty: "No jokers recorded yet.", onclick: openRunJS, sort: 1 });

defineTable("hands", [
  { label: "Hand", title: "Sorts by poker-hand strength.",
    cell: r => handCell(r.hand), sort: r => handRank(r.hand) },
  { label: "Score", num: true, style: "color:var(--chips);font-weight:700",
    cell: r => fmtScore(r.value), sort: r => r.ord },
  { label: "Lvl", num: true, cls: "muted",
    title: "The level that hand was at when this score was made.",
    cell: r => r.level ?? "—", sort: r => r.level },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
], { empty: "No hands recorded yet.", onclick: openRunJS, sort: 1 });

defineTable("handlevels", [
  { label: "Hand", title: "Sorts by poker-hand strength.",
    cell: r => handCell(r.hand), sort: r => handRank(r.hand) },
  { label: "Level", num: true, style: "color:var(--green);font-weight:700",
    title: "The highest that hand has ever been levelled, and the run that did it.",
    cell: r => fmt(r.level), sort: r => r.level },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
], { empty: "No hand levels recorded yet.", onclick: openRunJS, sort: 1 });

defineTable("handcounts", [
  { label: "Hand", title: "Sorts by poker-hand strength.",
    cell: r => handCell(r.hand), sort: r => handRank(r.hand) },
  { label: "Played", num: true, style: "color:var(--gold);font-weight:700",
    title: "The most times this hand was played within a single run.",
    cell: r => fmt(r.played), sort: r => r.played },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
], { empty: "No hands recorded yet.", onclick: openRunJS, sort: 1 });

const RUNS_COLS = () => [
  { label: "When", cls: "muted", cell: r => ago(r.started_ts),
    sort: r => r.started_ts },
  { label: "Deck", cell: deckCell, sort: r => r.deck_name },
  { label: "Stake", cell: stakeCell, sort: r => r.stake_key },
  { label: "Result",
    cell: r => resultChip(r) + (r.went_endless
      ? ' <span class="chip pixel-pill sm endless">ENDLESS</span>' : ""),
    sort: r => r.result || "" },
  { label: "Ante", num: true, cell: r => r.ante ?? "—", sort: r => r.ante },
  { label: "Rounds won", num: true, cls: "muted",
    title: "Blinds cleared. A round is only cashed out when its blind was beaten.",
    cell: r => r.rounds_won ?? "—", sort: r => r.rounds_won },
  { label: "Best hand", num: true, cell: r => fmtScore(r.best_hand),
    sort: r => r.bh_ord },
  { label: "Peak $", num: true,
    cell: r => r.peak_money !== null ? "$" + fmt(r.peak_money) : "—",
    sort: r => r.peak_money },
  { label: "Hands", num: true, cls: "muted", cell: r => r.hands_played ?? "—",
    sort: r => r.hands_played },
  { label: "Deck size", num: true, cls: "muted", cell: r => r.deck_size ?? "—",
    sort: r => r.deck_size },
  { label: "Seed", cell: seedCell, sort: r => r.seed },
];

// Where the metric column is inserted, and what it is called.
const METRIC_AT = 4;
const metricLabel = spec => {
  const [kind, subject] = (spec || "").split(":");
  const name = kind === "joker" ? nameOf(subject) : subject;
  return { joker: name + " peak", hand_score: name + " best",
           hand_level: name + " lvl", hand_played: name + " played" }[kind] || name;
};

function defineRunsTable() {
  const cols = RUNS_COLS();
  if (state.metric) {
    cols.splice(METRIC_AT, 0, {
      label: metricLabel(state.metric), num: true,
      style: "color:var(--gold);font-weight:700",
      cell: r => (r.metric_txt === null || r.metric_txt === undefined)
        ? `<span class="muted">—</span>` : fmt(r.metric_txt),
      sort: r => r.metric_ord,
    });
  }
  const prev = TBL.runs && TBL.runs.sort;
  defineTable("runs", cols, {
    empty: "No runs match these filters.", onclick: openRunJS,
    sort: state.metric ? METRIC_AT : 0,
  });
  // A column sort survives a refresh; a metric sort always owns its column.
  if (!state.metric && prev && prev.i !== null && prev.i < cols.length) {
    TBL.runs.sort = prev;
  }
  TBL.runs.onHeaderSort = i => {
    if (!state.metric || i === METRIC_AT) return false;
    state.metric = "";
    buildMetricPickers();
    refresh();
    return true;
  };
}
defineRunsTable();

async function refresh() {
  const [s, jok, hands, levels, counts, runs] = await Promise.all([
    get("/api/summary"), get("/api/jokers"), get("/api/hands"),
    get("/api/hand_levels"), get("/api/hand_counts"), get("/api/runs"),
  ]);

  $("#sub").textContent =
    `${s.runs} runs · ${s.won} won` + (s.win_pct !== null ? ` · ${s.win_pct}% win rate` : "");

  $("#tiles").innerHTML = [
    ["Best hand", fmtScore(s.best_hand), esc(s.best_hand_name || ""), "mult"],
    ["Most money", s.max_money !== null ? "$" + fmt(s.max_money) : "—", "peak balance", "money"],
    ["Furthest ante", fmt(s.max_ante), "", "gold"],
    ["Biggest cash-out", s.max_cashout !== null ? "$" + fmt(s.max_cashout) : "—", "one round", "money"],
    ["Largest deck", fmt(s.max_deck), "cards", "chips"],
    ["Runs", fmt(s.runs), `${s.won} won`, "purple"],
  ].map(([k, v, n, c]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div>
     <div class="n">${n}</div></div>`).join("");

  setRows("jokers", jok);
  setRows("hands", hands.best);
  setRows("handlevels", levels);
  setRows("handcounts", counts);
  defineRunsTable();
  setRows("runs", runs);

}

async function openRun(id) {
  history.replaceState(null, "", `#run=${encodeURIComponent(id)}`);
  const d = await fetch("/api/run?id=" + encodeURIComponent(id)).then(r => r.json());
  if (!d.run) return;
  const r = d.run;
  $("#dtitle").innerHTML = `${esc(r.deck_name) || "?"} · ${esc((r.stake_key || "").replace("stake_", ""))}
    ${resultChip(r)} ${r.went_endless ? '<span class="chip pixel-pill sm endless">ENDLESS</span>' : ""}`;
  const rounds = d.rounds.map(x => `
    <tr class="roundrow clickable" data-round="${x.round_seq}">
      <td class="num">${x.round_seq}</td>
      <td class="num">${x.ante ?? "—"}</td><td>${esc(x.blind_name) || "—"}</td>
      <td class="num">${fmtScore(x.required_txt)}</td><td class="num">${fmtScore(x.score_txt)}</td>
      <td class="num">${x.cashout_total !== null ? "$" + x.cashout_total : "—"}</td>
      <td class="num muted">${x.deck_size ?? "—"}</td>
      <td>${x.endless ? '<span class="chip pixel-pill sm endless">ENDLESS</span>' : ""}</td></tr>
    <tr class="detail" data-for="${x.round_seq}" hidden><td colspan="8"></td></tr>`).join("");
  const jok = d.jokers.map(j => `<tr><td>${esc(nameOf(j.key))}</td><td class="muted">${esc(j.field)}</td>
    <td class="num" style="color:var(--mult)">${fmt(j.peak)}</td></tr>`).join("");
  $("#dbody").innerHTML = `
    <h3>Run</h3>
    <div class="muted">seed ${esc(r.seed) || "?"} · ${r.hands_played ?? "?"} hands ·
      ended ante ${r.ended_ante ?? "?"} · $${r.final_dollars ?? "?"} ·
      ${d.segments.length} session${d.segments.length === 1 ? "" : "s"} ·
      log <code>${esc(r.log_file)}</code></div>
    ${d.defects.length ? `<div class="warn" style="margin-top:8px">⚠ capture defects:
      ${d.defects.map(x => esc(x.defect)).join(", ")} — figures from this run may not be
      comparable with newer ones.</div>` : ""}
    <h3>Rounds</h3>
    <div class="scroll"><table><thead><tr><th>#</th><th>Ante</th><th>Blind</th>
      <th class="num">Needed</th><th class="num">Scored</th><th class="num">Cash</th>
      <th class="num">Deck</th><th></th></tr></thead>
      <tbody>${rounds || '<tr><td colspan="8" class="empty">No rounds.</td></tr>'}</tbody></table></div>
    <h3>Joker peaks</h3>
    <div class="scroll"><table><thead><tr><th>Joker</th><th>Field</th>
      <th class="num">Peak</th></tr></thead>
      <tbody>${jok || '<tr><td colspan="3" class="empty">No scaling jokers.</td></tr>'}</tbody></table></div>`;
  $("#detail").showModal();

  // Expand a round to step through it: every play and discard in order, the
  // cards in each, the running score, and the jokers held at the time.
  $("#dbody").querySelectorAll("tr.roundrow").forEach(tr => {
    tr.onclick = () => toggleRound(id, tr);
  });
}

// `c.key` is the card's base: c_base for a plain card, m_lucky / m_steel /
// ... for an enhanced one. A stone card has no rank or suit to show -- the
// enhancement is the whole card -- so it gets no face.
function cardSprite(c) {
  const base = sprite(c.key || "c_base", "pc", 56);
  const face = c.key === "m_stone" ? ""
    : sprite(`card:${c.suit}:${c.rank}`, "pc face", 56);
  if (!base && !face) {
    return `<span class="jv">${esc((c.rank || "?") + ((c.suit || "")[0] || ""))}</span>`;
  }
  const ed = c.edition ? ` ed ed-${esc(String(c.edition).replace(/^e_/, ""))}` : "";
  const seal = c.seal
    ? `<span class="seal ${esc(String(c.seal).toLowerCase())}"></span>` : "";
  const what = [c.enhancement, c.seal && c.seal + " Seal",
                c.edition && String(c.edition).replace(/^e_/, "")]
    .filter(Boolean).join(", ");
  const label = `${c.rank || ""}${c.suit ? " of " + c.suit : ""}${what ? " (" + what + ")" : ""}`;
  return `<span class="pcard${ed}" title="${esc(label.trim())}">${base}${face}${seal}</span>`;
}

async function toggleRound(runId, tr) {
  const rs = tr.dataset.round;
  const row = $(`#dbody tr.detail[data-for="${rs}"]`);
  if (!row.hidden) { row.hidden = true; tr.classList.remove("open"); return; }
  tr.classList.add("open");
  row.hidden = false;
  const cell = row.firstElementChild;
  cell.innerHTML = `<div class="steps"><span class="muted">loading…</span></div>`;

  const d = await fetch(`/api/round?id=${encodeURIComponent(runId)}&round=${rs}`)
    .then(r => r.json());
  if (!d.steps || !d.steps.length) {
    cell.innerHTML = `<div class="steps"><span class="muted">Nothing recorded for this round.</span></div>`;
    return;
  }

  // Board first, then the actions in the order they were taken. The board is
  // its own thing rather than a row spliced between actions -- it is state,
  // not something that happened.
  const board = (d.board || []).length
    ? `<div class="board"><span class="lbl">Jokers</span>` +
      d.board.map(j => {
        // Named, not just drawn. Balatro's own data puts j_wee at the same
        // atlas cell as j_joker (game.lua:499, pos={x=0,y=0}), so Wee Joker
        // renders as a plain Joker and reads as missing from the board. The
        // name settles it for that and for any sprite we cannot resolve.
        return `<span class="bj" title="${esc(nameOf(j.key))}">` +
          (sprite(j.key, "j", 52) || "") +
          `<span class="bjn">${esc(nameOf(j.key))}</span>` +
          scaleTag(j.scale) + `</span>`;
      }).join("") + `</div>`
    : "";

  cell.innerHTML = board + `<div class="steps">` + d.steps.map(s => {
    const cards = (s.cards || []).map(cardSprite).join("");
    // Only what this action moved, so scaling stays visible without
    // reprinting the whole board on every row.
    const moved = (s.joker_delta || []).length
      ? `<div class="moved">` + s.joker_delta.map(m =>
          `<span class="bj" title="${esc(nameOf(m.key) + " " + m.field)}">` +
          (sprite(m.key, "j", 32) || "") +
          `<span class="jv">${esc(nameOf(m.key))}</span>` +
          scaleTag({ field: m.field, value: m.to })
          + `</span>`).join("") +
        `</div>`
      : "";
    const cash = s.money ? `<span class="cash">+$${fmt(s.money)}</span>` : "";

    if (s.kind === "play") {
      return `<div class="step play">
        <span class="what">${esc(s.hand) || "hand"}${s.level ? `<span class="jv">lvl ${s.level}</span>` : ""}</span>
        <span class="hand">${cards}${moved}</span>
        <span class="score"><b>+${fmtScore(s.score_txt)}</b><br>
          <span>${fmtScore(s.total_after)} total</span>${cash}</span></div>`;
    }
    const nc = s.cards_n ?? (s.cards || []).length;
    return `<div class="step discard">
      <span class="what">discard</span>
      <span class="hand">${cards}${moved}</span>
      <span class="score"><span>${nc} card${nc === 1 ? "" : "s"}</span>${cash}</span></div>`;
  }).join("") + `</div>`;
}

// ── wiring ───────────────────────────────────────────────────────────────
// A dropdown that shows each option's own art. Options are real buttons so
// Tab and Enter work; a native <select> cannot carry an image, and a row of
// buttons per deck stops fitting once every deck is in play.
function buildPicker(id, key, items, kind, px, allLabel, onPick) {
  const root = $("#" + id);
  const opts = [{ k: "", n: allLabel }].concat(items);
  // An item may carry its own art (the metric list mixes jokers and
  // planets), and a group entry is a heading rather than a choice.
  const face = it => (it.art !== undefined ? it.art
    : (it.k ? sprite(it.k, kind, px) || "" : "")) + `<span>${esc(it.n)}</span>`;

  function render() {
    const cur = opts.find(o => o.k === state[key]) || opts[0];
    root.innerHTML =
      `<button class="seg pixel-pill" aria-haspopup="listbox" aria-expanded="false"
        >${face(cur)}<span class="caret">▾</span></button>` +
      `<div class="menu" role="listbox">` +
      opts.map((o, i) => o.group
        ? `<div class="grp">${esc(o.n)}</div>`
        : `<button role="option" data-i="${i}"
        aria-selected="${o.k === state[key]}">${face(o)}</button>`).join("") +
      `</div>`;

    const btn = root.firstElementChild;
    const close = () => {
      root.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    };
    btn.onclick = ev => {
      ev.stopPropagation();
      const open = !root.classList.contains("open");
      // Only one menu open at a time.
      document.querySelectorAll(".pick.open").forEach(o => {
        o.classList.remove("open");
        o.firstElementChild.setAttribute("aria-expanded", "false");
      });
      root.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open);
    };
    root.querySelector(".menu").onclick = ev => {
      const b = ev.target.closest("button[role=option]");
      if (!b) return;
      ev.stopPropagation();
      state[key] = opts[+b.dataset.i].k;
      close();
      render();
      // Sibling pickers share this key, so they have to redraw: choosing a
      // joker has to clear whatever the hand pickers were showing.
      if (onPick) onPick();
      refresh();
    };
    root.onkeydown = ev => { if (ev.key === "Escape") { close(); btn.focus(); } };
  }
  render();
}

document.addEventListener("click", () => {
  document.querySelectorAll(".pick.open").forEach(o => {
    o.classList.remove("open");
    o.firstElementChild.setAttribute("aria-expanded", "false");
  });
});

// Sprites must be loaded first or every option falls back to text.
Promise.all([
  fetch("/api/meta").then(r => r.json()),
  SPR_READY,
]).then(([m]) => {
  buildPicker("deck", "deck", m.decks, "b", 48, "All decks");
  buildPicker("stake", "stake",
    m.stakes.map(x => ({ k: x.k, n: nameOf(x.k) })), "s", 36, "All stakes");
});

// What the run table can be sorted by instead of by one of its columns.
// Four pickers rather than one long grouped list, but they all write the
// same state.metric -- only one can be active, so choosing in any of them
// clears the other three simply by no longer matching their options.
let METRICS = null;
const METRIC_PICKERS = [
  ["m_joker",       "joker",       "Joker",       j => nameOf(j)],
  ["m_hand_score",  "hand_score",  "Hand",        h => h],
  ["m_hand_level",  "hand_level",  "Hand",        h => h],
  ["m_hand_played", "hand_played", "Hand",        h => h],
];

function buildMetricPickers() {
  if (!METRICS) return;
  for (const [id, kind, placeholder, label] of METRIC_PICKERS) {
    const subjects = kind === "joker" ? METRICS.jokers : METRICS.hands;
    const art = kind === "joker"
      ? k => sprite(k, "j", 30)
      : h => sprite((SPR && SPR.hand_planets && SPR.hand_planets[h]) || "", "j", 30);
    const opts = subjects.map(k => ({ k: `${kind}:${k}`, n: label(k), art: art(k) }));
    buildPicker(id, "metric", opts, "j", 30, placeholder, buildMetricPickers);
  }
}

Promise.all([fetch("/api/metrics").then(r => r.json()), SPR_READY])
  .then(([m]) => { METRICS = m; buildMetricPickers(); });

$("#noplasma").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  state.noplasma = on ? "1" : "";
  refresh();
};
$("#phase").onclick = e => {
  const b = e.target.closest("button.seg"); if (!b) return;
  phase[b.dataset.v] = !phase[b.dataset.v];
  b.setAttribute("aria-pressed", phase[b.dataset.v]);
  syncPhase(); refresh();
};
syncPhase();

// #run=<id> opens that run, optionally with #round=<n> expanded. Makes a run
// linkable, and means the dialog survives a reload.
async function openFromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const id = p.get("run");
  if (!id) return;
  await openRun(id);
  const rs = p.get("round");
  if (rs) {
    const tr = $(`#dbody tr.roundrow[data-round="${rs}"]`);
    if (tr) await toggleRound(id, tr);
  }
}
$("#detail").addEventListener("close", () => {
  if (location.hash) history.replaceState(null, "", location.pathname);
});

SPR_READY.then(refresh).then(openFromHash);

// The server watches the log directory and folds in whatever changes, so a run
// finished in Balatro shows up here on its own. Poll a counter rather than the
// data: it is one tiny query, and re-rendering only on a real change avoids
// yanking the page out from under someone mid-read.
//
// Exactly one timer, at page scope. An earlier version had this block pasted
// into each filter handler as well, so every filter change started another
// permanent poller.
let seenGeneration = null;
setInterval(async () => {
  if (document.hidden) return;
  try {
    const v = await fetch("/api/version").then(r => r.json());
    if (seenGeneration === null) { seenGeneration = v.generation; return; }
    if (v.generation !== seenGeneration) {
      seenGeneration = v.generation;
      await refresh();
      const sub = $("#sub");
      sub.classList.remove("fresh");
      void sub.offsetWidth;          // restart the animation
      sub.classList.add("fresh");
    }
  } catch { /* server gone; keep showing what we have */ }
}, 3000);
</script>
