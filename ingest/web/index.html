<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BalatroDB</title>
<style>
/* Balatro's own palette, lifted from G.C in globals.lua:
   MULT/RED FE5F55 · MONEY f3b958 · GOLD eac058 · FILTER ff9a00
   PURPLE 8867a5 · JOKER_GREY bfc7d5 · MAIN/DARK 374244 · BLIND_SIZE ad5353 */
:root {
  --bg:        #1b2223;
  --surface:   #374244;   /* G.C.MAIN */
  --raised:    #455254;
  --sunken:    #222b2c;
  --ink:       #ffffff;
  --ink-dim:   #bfc7d5;   /* G.C.JOKER_GREY */
  --ink-mute:  #8b969b;
  --mult:      #fe5f55;   /* G.C.MULT */
  --chips:     #009dff;
  --money:     #f3b958;   /* G.C.MONEY */
  --gold:      #eac058;   /* G.C.GOLD */
  --filter:    #ff9a00;   /* G.C.FILTER */
  --purple:    #8867a5;   /* G.C.PURPLE */
  --green:     #4bc292;
  --blind:     #ad5353;   /* G.C.BLIND_SIZE */
  --r: 0.45rem;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 16px 64px;
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 "m6x11", "Courier New", ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: .02em; }
a { color: var(--chips); }

/* Balatro's chunky embossed panel: a lip of darker colour under each block */
.panel {
  background: var(--surface); border-radius: var(--r);
  box-shadow: 0 4px 0 #222b2c, 0 5px 10px rgba(0,0,0,.35);
  padding: 14px 16px;
}
header {
  max-width: 1240px; margin: 0 auto; padding: 22px 0 14px;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
header h1 { font-size: 26px; }
header h1 span { color: var(--mult); }
header .sub { color: var(--ink-mute); font-size: 12px; }
/* brief pulse when new runs arrive, so an update is noticed without a banner
   that shifts the layout */
@keyframes flash { from { color: var(--gold); } to { color: var(--ink-mute); } }
header .sub.fresh { animation: flash 1.6s ease-out; }
@media (prefers-reduced-motion: reduce) { header .sub.fresh { animation: none; } }
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }

/* ── filters: one row above everything, per the interaction spec ───────── */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters label { color: var(--ink-dim); font-size: 12px; margin-right: 4px; }
select, button.seg {
  background: var(--sunken); color: var(--ink); border: 0;
  border-radius: .35rem; padding: 7px 10px; font: inherit; font-size: 13px;
  box-shadow: 0 2px 0 #171d1e; cursor: pointer;
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--filter); outline-offset: 2px; }
.seggroup { display: inline-flex; gap: 4px; }
button.seg[aria-pressed="true"] { background: var(--mult); color: #2a1210; font-weight: 700; }

/* ── stat tiles: hero numbers, no chart ───────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px 14px;
        box-shadow: 0 4px 0 #222b2c; }
.tile .k { color: var(--ink-mute); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 4px;
           overflow-wrap: anywhere; }
.tile .n { color: var(--ink-dim); font-size: 11px; margin-top: 2px; }
.v.mult { color: var(--mult); } .v.money { color: var(--money); }
.v.chips { color: var(--chips); } .v.gold { color: var(--gold); }
.v.purple { color: var(--purple); } .v.green { color: var(--green); }

/* ── tables ───────────────────────────────────────────────────────────── */
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
         align-items: start; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; color: var(--ink-mute); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px 8px;
  white-space: nowrap; position: sticky; top: 0; background: var(--surface);
}
td { padding: 6px 8px; border-top: 1px solid #2b3536; white-space: nowrap; }
tbody tr:hover { background: #404d4f; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 99px;
  font-size: 11px; font-weight: 700; color: #1b2223;
}
.chip.win { background: var(--gold); }
.chip.died { background: var(--blind); color: #fff; }
.chip.endless { background: var(--purple); color: #fff; }
.chip.susp { background: #566264; color: var(--ink-dim); }
.chip.live { background: var(--green); }
.muted { color: var(--ink-mute); }
/* Sprites are cells of the game's own atlases, positioned with
   background-position. Scaled by background-size so one rule covers any
   display size. */
.spr { display: inline-block; vertical-align: middle; background-repeat: no-repeat;
       image-rendering: pixelated; flex: none; }
.spr.j { width: 30px; height: 40px; }
.spr.b { width: 26px; height: 35px; }
.spr.s { width: 20px; height: 20px; }
.namecell { display: flex; align-items: center; gap: 8px; }
.sub2 { color: var(--ink-mute); font-size: 11px; }
.deckcell { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.clickable { cursor: pointer; }

/* ── single-series bar chart: ante distribution ───────────────────────── */
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 54px 1fr 34px; align-items: center; gap: 8px; }
.bar .track { background: var(--sunken); border-radius: 3px; height: 15px;
               display: block; overflow: hidden; }
.bar .fill { background: var(--chips); height: 100%; border-radius: 0 3px 3px 0;
             min-width: 3px; display: block; }
.bar .lab, .bar .cnt { color: var(--ink-dim); font-size: 12px; }
.bar .cnt { text-align: right; font-variant-numeric: tabular-nums; }

/* ── run detail drawer ────────────────────────────────────────────────── */
dialog {
  background: var(--surface); color: var(--ink); border: 0; border-radius: var(--r);
  max-width: min(960px, 94vw); width: 100%; padding: 0;
  box-shadow: 0 10px 0 #222b2c, 0 20px 50px rgba(0,0,0,.6);
}
dialog::backdrop { background: rgba(10,14,15,.72); }
dialog .head { display: flex; justify-content: space-between; align-items: center;
               padding: 14px 18px; border-bottom: 1px solid #2b3536; gap: 12px; }
dialog .body { padding: 16px 18px; max-height: 72vh; overflow: auto; }
dialog h3 { font-size: 13px; color: var(--ink-mute); text-transform: uppercase;
            letter-spacing: .07em; margin: 16px 0 6px; }
dialog h3:first-child { margin-top: 0; }
button.x { background: var(--sunken); color: var(--ink-dim); border: 0;
           border-radius: .3rem; padding: 6px 12px; cursor: pointer; font: inherit; }
.empty { color: var(--ink-mute); padding: 14px 4px; }

/* expandable round timeline */
tr.roundrow td:first-child::before {
  content: ""; display: inline-block; width: 0; height: 0; margin-right: 6px;
  border: 4px solid transparent; border-left-color: var(--ink-mute);
  transition: transform .12s; transform-origin: 2px 50%;
}
tr.roundrow.open td:first-child::before { transform: rotate(90deg); }
tr.detail > td { padding: 0; border-top: 0; }
.steps { background: var(--sunken); border-radius: .3rem; margin: 2px 0 8px;
         padding: 8px 10px; display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px;
        align-items: center; padding: 5px 6px; border-radius: .25rem; }
.step.play { background: #2c393b; }
.step .what { font-size: 12px; font-weight: 700; }
.step.play .what { color: var(--chips); }
.step.discard .what { color: var(--ink-mute); }
.hand { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.step .score { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.step .score b { color: var(--mult); }
.step .score span { color: var(--ink-mute); font-size: 11px; }
.jokrow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
          padding: 2px 6px 4px; }
.jokrow .lbl { color: var(--ink-mute); font-size: 11px; margin-right: 4px; }
.jv { color: var(--ink-dim); font-size: 10px; }
.warn { color: var(--filter); font-size: 12px; }
@media (max-width: 560px) { header h1 { font-size: 21px; } .tile .v { font-size: 21px; } }
</style>
</head>
<body>
<header>
  <h1>Balatro<span>DB</span></h1>
  <div class="sub" id="sub">loading…</div>
</header>

<main>
  <section class="panel filters" aria-label="Filters">
    <span><label for="deck">Deck</label><select id="deck"><option value="">All</option></select></span>
    <span><label for="stake">Stake</label><select id="stake"><option value="">All</option></select></span>
    <span><label>Include</label>
      <span class="seggroup" id="phase" role="group" aria-label="Which phases to include">
        <button class="seg" data-v="0" aria-pressed="true"
          title="Everything up to the point a run continued past the win ante">Non-endless</button>
        <button class="seg" data-v="1" aria-pressed="true"
          title="Only what happened after continuing past the win ante">Endless</button>
      </span></span>
    <span><label for="sort">Sort runs</label><select id="sort">
      <option value="recent">Most recent</option>
      <option value="score">Best hand</option>
      <option value="ante">Furthest ante</option>
      <option value="money">Most money</option>
      <option value="hands">Hands played</option>
    </select></span>
  </section>

  <section class="tiles" id="tiles" aria-label="Records"></section>

  <section class="cols">
    <div class="panel">
      <h2 title="Highest value ever reached, from joker.scale events.">Scaling jokers</h2>
      <div class="scroll"><table id="jokers"><thead><tr>
        <th>Joker</th><th>Field</th><th class="num">Peak</th><th>Deck</th><th>Stake</th>
      </tr></thead><tbody></tbody></table></div>
    </div>

    <div class="panel">
      <h2 title="These jokers read game counters rather than their own ability, so their value is reconstructed from run history.">Counter jokers</h2>
      <div class="scroll"><table id="derived"><thead><tr>
        <th>Joker</th><th class="num">Peak</th><th>Deck</th><th>Stake</th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section class="cols">
    <div class="panel">
      <h2>Best hand by type</h2>
      <div class="scroll"><table id="hands"><thead><tr>
        <th>Hand</th><th class="num">Score</th><th class="num">Lvl</th><th class="num">Max</th><th>Deck</th><th>Stake</th>
      </tr></thead><tbody></tbody></table></div>
    </div>

    <div class="panel">
      <h2 title="Runs by furthest ante reached.">How far runs get</h2>
      <div class="bars" id="antes"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Runs</h2>
    <div class="scroll"><table id="runs"><thead><tr>
      <th>When</th><th>Deck</th><th>Stake</th><th>Result</th>
      <th class="num">Ante</th><th class="num">Best hand</th><th class="num">Peak $</th>
      <th class="num">Hands</th><th class="num">Deck</th><th>Seed</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
</main>

<dialog id="detail"><div class="head"><h2 id="dtitle">Run</h2>
  <button class="x" onclick="detail.close()">Close</button></div>
  <div class="body" id="dbody"></div></dialog>

<script>
const $ = s => document.querySelector(s);

// Everything rendered here came out of a log file, and a log can carry a
// modded deck or joker name verbatim. These strings go into innerHTML, so they
// are escaped at the point of interpolation rather than trusted.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Two independent toggles rather than three exclusive options. Both on (or
// both off) means no phase filter at all -- which is what "all runs" should
// mean, and is not expressible with mutually exclusive buttons.
const phase = { "0": true, "1": true };
const state = { deck: "", stake: "", endless: "", sort: "recent" };

function syncPhase() {
  const on = Object.keys(phase).filter(k => phase[k]);
  // exactly one selected -> filter to it; otherwise include everything
  state.endless = on.length === 1 ? on[0] : "";
}

// Big numbers arrive as exact decimal text and can exceed Number range, so
// format from the string rather than parseFloat where possible.
const fmt = v => {
  if (v === null || v === undefined || v === "") return "—";
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  if (Math.abs(n) >= 1e12) return n.toExponential(3).replace("e+", "e");
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
};
const ago = ts => {
  if (!ts) return "—";
  const d = new Date(ts * 1000), s = (Date.now() / 1000) - ts;
  if (s < 86400) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
};
const shortKey = k => (k || "").replace(/^j_/, "").replace(/_/g, " ");

// Atlas metadata, extracted from the game by ingest/extract_assets.py. Absent
// if that has not been run, in which case everything falls back to text.
let SPR = null;
fetch("assets/sprites.json").then(r => r.ok ? r.json() : null)
  .then(d => { SPR = d; }).catch(() => {});

function sprite(key, kind, px) {
  if (!SPR || !key || !SPR.sprites[key]) return "";
  const s = SPR.sprites[key], a = SPR.atlases[s.a];
  if (!a) return "";
  const scale = px / a.cw;
  return `<span class="spr ${kind}" title="${esc(key)}" style="
      width:${px}px; height:${(a.ch * scale).toFixed(1)}px;
      background-image:url(assets/${s.a});
      background-size:${(a.w * scale).toFixed(1)}px ${(a.h * scale).toFixed(1)}px;
      background-position:-${(s.x * a.cw * scale).toFixed(1)}px -${(s.y * a.ch * scale).toFixed(1)}px"></span>`;
}

const deckCell = r => `<span class="deckcell">${sprite(r.deck_key, "b", 26)}
  <span>${esc(r.deck_name) || "—"}</span></span>`;
const stakeCell = r => `<span class="deckcell">${sprite(r.stake_key, "s", 20)}
  <span class="muted">${esc((r.stake_key || "").replace("stake_", "")) || "—"}</span></span>`;
const shortRun = r => (r || "").split("-")[1] || r;

const qs = () => {
  const p = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v !== "") p.set(k, v);
  return p.toString();
};
const get = path => fetch(path + "?" + qs()).then(r => r.json());

function resultChip(r) {
  // No run.end yet: either still being played, or the game crashed. The log
  // grows as you play, so this row updates live.
  if (!r.result) return `<span class="chip live">IN PROGRESS</span>`;
  if (r.won) return `<span class="chip win">WON</span>`;
  if (r.result === "died") return `<span class="chip died">DIED</span>`;
  if (r.result === "suspended") return `<span class="chip susp">PAUSED</span>`;
  return `<span class="muted">${r.result || "—"}</span>`;
}

async function refresh() {
  const [s, jok, der, hands, antes, runs] = await Promise.all([
    get("/api/summary"), get("/api/jokers"), get("/api/derived"),
    get("/api/hands"), get("/api/antes"), get("/api/runs"),
  ]);

  $("#sub").textContent =
    `${s.runs} runs · ${s.won} won` + (s.win_pct !== null ? ` · ${s.win_pct}% win rate` : "");

  $("#tiles").innerHTML = [
    ["Best hand", fmt(s.best_hand), s.best_hand_name || "", "mult"],
    ["Most money", s.max_money !== null ? "$" + fmt(s.max_money) : "—", "peak balance", "money"],
    ["Furthest ante", fmt(s.max_ante), "", "gold"],
    ["Biggest cash-out", s.max_cashout !== null ? "$" + fmt(s.max_cashout) : "—", "one round", "money"],
    ["Largest deck", fmt(s.max_deck), "cards", "chips"],
    ["Runs", fmt(s.runs), `${s.won} won`, "purple"],
  ].map(([k, v, n, c]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div>
     <div class="n">${n}</div></div>`).join("");

  $("#jokers tbody").innerHTML = jok.length ? jok.map(j => `
    <tr class="clickable" onclick="openRun('${esc(j.run_id)}')">
      <td><span class="namecell">${sprite(j.key, "j", 30)}
          <span>${esc(shortKey(j.key))}</span></span></td>
      <td class="muted">${esc(j.field)}</td>
      <td class="num" style="color:var(--mult);font-weight:700">${fmt(j.value)}</td>
      <td>${deckCell(j)}</td><td>${stakeCell(j)}</td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">No scaling jokers recorded yet.</td></tr>`;

  $("#derived tbody").innerHTML = der.length ? der.map(d => `
    <tr class="clickable" onclick="openRun('${esc(d.run_id)}')">
      <td><span class="namecell">${sprite(d.joker_key, "j", 30)}
          <span>${esc(d.joker)}<br><span class="sub2">${esc(d.what)}</span></span></span></td>
      <td class="num" style="color:var(--green);font-weight:700">${fmt(d.value)}</td>
      <td>${deckCell(d)}</td><td>${stakeCell(d)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">Nothing yet.</td></tr>`;

  const lvl = Object.fromEntries(hands.levels.map(l => [l.hand, l.level]));
  $("#hands tbody").innerHTML = hands.best.length ? hands.best.map(h => `
    <tr class="clickable" onclick="openRun('${esc(h.run_id)}')">
      <td>${esc(h.hand)}</td>
      <td class="num" style="color:var(--chips);font-weight:700">${fmt(h.value)}</td>
      <td class="num muted">${h.level ?? "—"}</td>
      <td class="num muted">${lvl[h.hand] ?? "—"}</td>
      <td>${deckCell(h)}</td><td>${stakeCell(h)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No hands recorded yet.</td></tr>`;

  const max = Math.max(1, ...antes.map(a => a.n));
  $("#antes").innerHTML = antes.length ? antes.map(a => `
    <div class="bar"><span class="lab">Ante ${a.ante}</span>
      <span class="track"><span class="fill" style="width:${(a.n / max * 100).toFixed(1)}%"></span></span>
      <span class="cnt">${a.n}</span></div>`).join("")
    : `<div class="empty">No completed runs yet.</div>`;

  $("#runs tbody").innerHTML = runs.length ? runs.map(r => `
    <tr class="clickable" onclick="openRun('${esc(r.run_id)}')">
      <td class="muted">${ago(r.started_ts)}</td>
      <td>${deckCell(r)}</td>
      <td>${stakeCell(r)}</td>
      <td>${resultChip(r)}${r.went_endless ? ' <span class="chip endless">ENDLESS</span>' : ""}</td>
      <td class="num">${r.ante ?? "—"}</td>
      <td class="num">${fmt(r.best_hand)}</td>
      <td class="num">${r.peak_money !== null ? "$" + fmt(r.peak_money) : "—"}</td>
      <td class="num muted">${r.hands_played ?? "—"}</td>
      <td class="num muted">${r.deck_size ?? "—"}</td>
      <td class="muted">${esc(r.seed) || "—"}${r.seeded ? " ·seeded" : ""}</td></tr>`).join("")
    : `<tr><td colspan="10" class="empty">No runs match these filters.</td></tr>`;
}

async function openRun(id) {
  history.replaceState(null, "", `#run=${encodeURIComponent(id)}`);
  const d = await fetch("/api/run?id=" + encodeURIComponent(id)).then(r => r.json());
  if (!d.run) return;
  const r = d.run;
  $("#dtitle").innerHTML = `${esc(r.deck_name) || "?"} · ${esc((r.stake_key || "").replace("stake_", ""))}
    ${resultChip(r)} ${r.went_endless ? '<span class="chip endless">ENDLESS</span>' : ""}`;
  const rounds = d.rounds.map(x => `
    <tr class="roundrow clickable" data-round="${x.round_seq}">
      <td class="num">${x.round_seq}</td>
      <td class="num">${x.ante ?? "—"}</td><td>${esc(x.blind_name) || "—"}</td>
      <td class="num">${fmt(x.required_txt)}</td><td class="num">${fmt(x.score_txt)}</td>
      <td class="num">${x.cashout_total !== null ? "$" + x.cashout_total : "—"}</td>
      <td class="num muted">${x.deck_size ?? "—"}</td>
      <td>${x.endless ? '<span class="chip endless">ENDLESS</span>' : ""}</td></tr>
    <tr class="detail" data-for="${x.round_seq}" hidden><td colspan="8"></td></tr>`).join("");
  const jok = d.jokers.map(j => `<tr><td>${shortKey(j.key)}</td><td class="muted">${esc(j.field)}</td>
    <td class="num" style="color:var(--mult)">${fmt(j.peak)}</td></tr>`).join("");
  $("#dbody").innerHTML = `
    <h3>Run</h3>
    <div class="muted">seed ${esc(r.seed) || "?"} · ${r.hands_played ?? "?"} hands ·
      ended ante ${r.ended_ante ?? "?"} · $${r.final_dollars ?? "?"} ·
      ${d.segments.length} session${d.segments.length === 1 ? "" : "s"} ·
      log <code>${esc(r.log_file)}</code></div>
    ${d.defects.length ? `<div class="warn" style="margin-top:8px">⚠ capture defects:
      ${d.defects.map(x => esc(x.defect)).join(", ")} — figures from this run may not be
      comparable with newer ones.</div>` : ""}
    <h3>Rounds</h3>
    <div class="scroll"><table><thead><tr><th>#</th><th>Ante</th><th>Blind</th>
      <th class="num">Needed</th><th class="num">Scored</th><th class="num">Cash</th>
      <th class="num">Deck</th><th></th></tr></thead>
      <tbody>${rounds || '<tr><td colspan="8" class="empty">No rounds.</td></tr>'}</tbody></table></div>
    <h3>Joker peaks</h3>
    <div class="scroll"><table><thead><tr><th>Joker</th><th>Field</th>
      <th class="num">Peak</th></tr></thead>
      <tbody>${jok || '<tr><td colspan="3" class="empty">No scaling jokers.</td></tr>'}</tbody></table></div>`;
  $("#detail").showModal();

  // Expand a round to step through it: every play and discard in order, the
  // cards in each, the running score, and the jokers held at the time.
  $("#dbody").querySelectorAll("tr.roundrow").forEach(tr => {
    tr.onclick = () => toggleRound(id, tr);
  });
}

const cardSprite = c => sprite(`card:${c.suit}:${c.rank}`, "c", 32)
  || `<span class="jv">${(c.rank || "?")}${(c.suit || "")[0] || ""}</span>`;

async function toggleRound(runId, tr) {
  const rs = tr.dataset.round;
  const row = $(`#dbody tr.detail[data-for="${rs}"]`);
  if (!row.hidden) { row.hidden = true; tr.classList.remove("open"); return; }
  tr.classList.add("open");
  row.hidden = false;
  const cell = row.firstElementChild;
  cell.innerHTML = `<div class="steps"><span class="muted">loading…</span></div>`;

  const d = await fetch(`/api/round?id=${encodeURIComponent(runId)}&round=${rs}`)
    .then(r => r.json());
  if (!d.steps || !d.steps.length) {
    cell.innerHTML = `<div class="steps"><span class="muted">Nothing recorded for this round.</span></div>`;
    return;
  }

  let lastJokers = "";
  cell.innerHTML = `<div class="steps">` + d.steps.map(s => {
    const cards = (s.cards || []).map(cardSprite).join("");
    // Only reprint the joker row when the loadout or its values changed.
    const jkey = (s.jokers || []).map(j =>
      `${j.key}:${j.mult ?? ""}/${j.x_mult ?? ""}/${j.chips ?? ""}/${j.extra ?? ""}`).join("|");
    let jrow = "";
    if (jkey && jkey !== lastJokers) {
      lastJokers = jkey;
      jrow = `<div class="jokrow"><span class="lbl">jokers</span>` +
        s.jokers.map(j => {
          const v = j.chips ?? j.mult ?? j.x_mult ?? j.extra;
          return sprite(j.key, "j", 26) +
            (v !== null && v !== undefined ? `<span class="jv">${fmt(v)}</span>` : "");
        }).join("") + `</div>`;
    }
    if (s.kind === "play") {
      return jrow + `<div class="step play">
        <span class="what">${esc(s.hand) || "hand"}${s.level ? ` <span class="jv">lvl ${s.level}</span>` : ""}</span>
        <span class="hand">${cards}</span>
        <span class="score"><b>+${fmt(s.score_txt)}</b><br>
          <span>${fmt(s.total_after)} total</span></span></div>`;
    }
    return jrow + `<div class="step discard">
      <span class="what">discard</span>
      <span class="hand">${cards}</span>
      <span class="score"><span>${s.cards_n ?? (s.cards || []).length} cards</span></span></div>`;
  }).join("") + `</div>`;
}

// ── wiring ───────────────────────────────────────────────────────────────
fetch("/api/meta").then(r => r.json()).then(m => {
  $("#deck").innerHTML = '<option value="">All decks</option>' +
    m.decks.map(d => `<option value="${esc(d.k)}">${esc(d.n)}</option>`).join("");
  $("#stake").innerHTML = '<option value="">All stakes</option>' +
    m.stakes.map(s => `<option value="${esc(s.k)}">${esc(s.k.replace("stake_", ""))}</option>`).join("");
});
$("#deck").onchange = e => { state.deck = e.target.value; refresh(); };
$("#stake").onchange = e => { state.stake = e.target.value; refresh(); };
$("#sort").onchange = e => { state.sort = e.target.value; refresh(); };
$("#phase").onclick = e => {
  const b = e.target.closest("button.seg"); if (!b) return;
  phase[b.dataset.v] = !phase[b.dataset.v];
  b.setAttribute("aria-pressed", phase[b.dataset.v]);
  syncPhase(); refresh();
};
syncPhase();

// #run=<id> opens that run, optionally with #round=<n> expanded. Makes a run
// linkable, and means the dialog survives a reload.
async function openFromHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const id = p.get("run");
  if (!id) return;
  await openRun(id);
  const rs = p.get("round");
  if (rs) {
    const tr = $(`#dbody tr.roundrow[data-round="${rs}"]`);
    if (tr) await toggleRound(id, tr);
  }
}
$("#detail").addEventListener("close", () => {
  if (location.hash) history.replaceState(null, "", location.pathname);
});

refresh().then(openFromHash);

// The server watches the log directory and folds in whatever changes, so a run
// finished in Balatro shows up here on its own. Poll a counter rather than the
// data: it is one tiny query, and re-rendering only on a real change avoids
// yanking the page out from under someone mid-read.
//
// Exactly one timer, at page scope. An earlier version had this block pasted
// into each filter handler as well, so every filter change started another
// permanent poller.
let seenGeneration = null;
setInterval(async () => {
  if (document.hidden) return;
  try {
    const v = await fetch("/api/version").then(r => r.json());
    if (seenGeneration === null) { seenGeneration = v.generation; return; }
    if (v.generation !== seenGeneration) {
      seenGeneration = v.generation;
      await refresh();
      const sub = $("#sub");
      sub.classList.remove("fresh");
      void sub.offsetWidth;          // restart the animation
      sub.classList.add("fresh");
    }
  } catch { /* server gone; keep showing what we have */ }
}, 3000);
</script>
</body>
</html>
